<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理后台 · ks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/easymde@2.18.0/dist/easymde.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #FAFAFE;
            color: #1A1A2E;
            min-height: 100vh;
            transition: background 0.4s ease, color 0.3s ease;
        }
        body.dark {
            background: #14131F;
            color: #E8E6F0;
        }
        body.dark .EasyMDEContainer .CodeMirror {
            background: rgba(255, 255, 255, 0.05);
            color: #E8E6F0;
            border-color: rgba(255, 255, 255, 0.08);
        }
        body.dark .EasyMDEContainer .CodeMirror-cursor {
            border-color: #E8E6F0;
        }
        body.dark .editor-toolbar {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
        }
        body.dark .editor-toolbar button {
            color: #9A96B8;
        }
        body.dark .editor-toolbar button:hover {
            background: rgba(136, 204, 255, 0.12);
            color: #88ccff;
        }
        body.dark .editor-toolbar i.separator {
            border-color: rgba(255, 255, 255, 0.08);
        }
        body.dark .CodeMirror-selected {
            background: rgba(136, 204, 255, 0.15);
        }
        body.dark .editor-preview {
            background: rgba(255, 255, 255, 0.03);
            color: #D0CAF0;
        }
        body.dark .editor-preview h1,
        body.dark .editor-preview h2,
        body.dark .editor-preview h3,
        body.dark .editor-preview h4,
        body.dark .editor-preview h5,
        body.dark .editor-preview h6 {
            color: #E8E6F0;
        }
        body.dark .editor-preview blockquote {
            border-left-color: #88ccff;
            color: #A8A4C8;
        }
        body.dark .editor-preview code {
            background: rgba(255, 255, 255, 0.06);
        }
        body.dark .editor-preview table th,
        body.dark .editor-preview table td {
            border-color: rgba(255, 255, 255, 0.06);
        }
        body.dark .editor-preview table th {
            background: rgba(255, 255, 255, 0.04);
        }
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 30% 30%, #F6F2FF, #FFFFFF);
            transition: background 0.5s ease;
        }
        body.dark .bg-glow {
            background: radial-gradient(circle at 30% 30%, #28253D, #0E0D18);
        }
        .glow-soft {
            position: fixed;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(160, 130, 230, 0.15), rgba(210, 190, 255, 0) 70%);
            border-radius: 50%;
            top: -25vh;
            right: -20vw;
            z-index: -1;
            filter: blur(80px);
            animation: floatGlow 20s infinite alternate ease-in-out;
            transition: background 0.5s ease;
        }
        body.dark .glow-soft {
            background: radial-gradient(circle, rgba(120, 100, 200, 0.20), rgba(60, 40, 120, 0) 70%);
        }
        .glow-soft-2 {
            position: fixed;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(200, 180, 255, 0.10), rgba(255, 240, 255, 0) 70%);
            border-radius: 50%;
            bottom: -15vh;
            left: -10vw;
            z-index: -1;
            filter: blur(70px);
            animation: floatGlow2 22s infinite alternate ease-in-out;
            transition: background 0.5s ease;
        }
        body.dark .glow-soft-2 {
            background: radial-gradient(circle, rgba(90, 70, 160, 0.15), rgba(30, 20, 60, 0) 70%);
        }
        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1);
                opacity: 0.3; }
            100% { transform: translate(5%, 8%) scale(1.2);
                opacity: 0.7; }
        }
        @keyframes floatGlow2 {
            0% { transform: translate(0, 0) scale(1);
                opacity: 0.2; }
            100% { transform: translate(-6%, -5%) scale(1.3);
                opacity: 0.6; }
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 60px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #4F4F78;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 6px 20px rgba(80, 60, 160, 0.10);
            user-select: none;
        }
        .theme-toggle:hover {
            transform: scale(1.05) rotate(8deg);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 28px rgba(80, 60, 160, 0.18);
        }
        body.dark .theme-toggle {
            background: rgba(30, 28, 50, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            color: #D0CAF0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        body.dark .theme-toggle:hover {
            background: rgba(50, 45, 80, 0.8);
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1.5rem 2rem;
            min-height: 100vh;
            position: relative;
        }
        #loginScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        #loginScreen.hidden {
            display: none;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2.8rem 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 24px 60px rgba(80, 60, 160, 0.10);
            width: 100%;
            max-width: 380px;
            text-align: center;
            transition: background 0.4s ease, border-color 0.3s ease;
        }
        body.dark .login-card {
            background: rgba(30, 28, 50, 0.50);
            border-color: rgba(255, 255, 255, 0.06);
        }
        .login-card h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            background: linear-gradient(135deg, #201D3A, #5B4DAF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        body.dark .login-card h1 {
            background: linear-gradient(135deg, #C8C0F0, #8F7BE0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .login-card .sub {
            color: #8A8AB5;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }
        body.dark .login-card .sub {
            color: #9A96B8;
        }
        .login-card input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border-radius: 60px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            color: #1A1A2E;
            transition: 0.3s ease;
            margin-bottom: 1rem;
        }
        body.dark .login-card input {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: #E8E6F0;
        }
        .login-card input:focus {
            outline: none;
            border-color: #6B5ACF;
            box-shadow: 0 0 0 3px rgba(107, 90, 207, 0.15);
        }
        .login-card .btn-login {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 60px;
            background: linear-gradient(145deg, #7A6BCF, #624ED0);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 8px 24px rgba(90, 70, 170, 0.25);
        }
        .login-card .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(90, 70, 170, 0.35);
        }
        body.dark .login-card .btn-login {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .login-card .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .login-card .error-msg {
            color: #E57373;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            min-height: 1.5rem;
        }
        #mainApp {
            display: none;
        }
        #mainApp.active {
            display: block;
        }
        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .admin-header .title {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #201D3A, #5B4DAF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        body.dark .admin-header .title {
            background: linear-gradient(135deg, #C8C0F0, #8F7BE0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .admin-header .btn-logout {
            padding: 0.4rem 1.2rem;
            border: none;
            border-radius: 60px;
            background: rgba(0, 0, 0, 0.06);
            color: #6A6A92;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.2s ease;
        }
        body.dark .admin-header .btn-logout {
            background: rgba(255, 255, 255, 0.08);
            color: #9A96B8;
        }
        .admin-header .btn-logout:hover {
            background: rgba(0, 0, 0, 0.1);
        }
        body.dark .admin-header .btn-logout:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .tabs {
            display: flex;
            gap: 0.3rem;
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 1.5rem;
            overflow-x: auto;
        }
        body.dark .tabs {
            background: rgba(40, 38, 65, 0.30);
            border-color: rgba(255, 255, 255, 0.06);
        }
        .tabs .tab {
            padding: 0.6rem 1.4rem;
            border: none;
            border-radius: 60px;
            background: transparent;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            color: #6A6A92;
            cursor: pointer;
            transition: 0.25s ease;
            white-space: nowrap;
        }
        body.dark .tabs .tab {
            color: #9A96B8;
        }
        .tabs .tab:hover {
            color: #3D2D8A;
        }
        body.dark .tabs .tab:hover {
            color: #C8C0F0;
        }
        .tabs .tab.active {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            color: #3D2D8A;
            box-shadow: 0 4px 16px rgba(80, 60, 160, 0.08);
        }
        body.dark .tabs .tab.active {
            background: rgba(60, 55, 100, 0.55);
            color: #C8C0F0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        .tabs .tab .badge {
            display: inline-block;
            background: rgba(107, 90, 207, 0.15);
            color: #6B5ACF;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.05rem 0.5rem;
            border-radius: 40px;
            margin-left: 0.3rem;
        }
        body.dark .tabs .tab .badge {
            background: rgba(136, 204, 255, 0.12);
            color: #88ccff;
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            0% { opacity: 0;
                transform: translateY(8px); }
            100% { opacity: 1;
                transform: translateY(0); }
        }
        .editor-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }
        @media (max-width: 768px) {
            .editor-section {
                grid-template-columns: 1fr;
            }
        }
        .editor-panel {
            background: rgba(255, 255, 255, 0.40);
            backdrop-filter: blur(8px);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: background 0.4s ease, border-color 0.3s ease;
        }
        body.dark .editor-panel {
            background: rgba(40, 38, 65, 0.30);
            border-color: rgba(255, 255, 255, 0.05);
        }
        .editor-panel .panel-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #8A8AB5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.6rem;
        }
        body.dark .editor-panel .panel-label {
            color: #7A7AA0;
        }
        .editor-panel input,
        .editor-panel .tag-input-wrap {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.5);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            color: #1A1A2E;
            transition: 0.3s ease;
            margin-bottom: 0.8rem;
        }
        body.dark .editor-panel input,
        body.dark .editor-panel .tag-input-wrap {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: #E8E6F0;
        }
        .editor-panel input:focus {
            outline: none;
            border-color: #6B5ACF;
            box-shadow: 0 0 0 3px rgba(107, 90, 207, 0.10);
        }
        .EasyMDEContainer {
            border-radius: 12px;
            overflow: hidden;
        }
        .EasyMDEContainer .CodeMirror {
            min-height: 400px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.7;
            border-radius: 0 0 12px 12px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.5);
            color: #1A1A2E;
        }
        body.dark .EasyMDEContainer .CodeMirror {
            background: rgba(255, 255, 255, 0.05);
            color: #E8E6F0;
            border-color: rgba(255, 255, 255, 0.08);
        }
        .EasyMDEContainer .CodeMirror-focused {
            border-color: #6B5ACF;
            box-shadow: 0 0 0 3px rgba(107, 90, 207, 0.10);
        }
        .EasyMDEContainer .editor-toolbar {
            border-radius: 12px 12px 0 0;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-bottom: none;
            background: rgba(255, 255, 255, 0.3);
        }
        body.dark .EasyMDEContainer .editor-toolbar {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
        }
        .EasyMDEContainer .editor-toolbar button {
            color: #6A6A92;
        }
        body.dark .EasyMDEContainer .editor-toolbar button {
            color: #9A96B8;
        }
        .EasyMDEContainer .editor-toolbar button:hover {
            background: rgba(107, 90, 207, 0.10);
            color: #6B5ACF;
        }
        body.dark .EasyMDEContainer .editor-toolbar button:hover {
            background: rgba(136, 204, 255, 0.12);
            color: #88ccff;
        }
        .EasyMDEContainer .editor-toolbar i.separator {
            border-color: rgba(0, 0, 0, 0.08);
        }
        body.dark .EasyMDEContainer .editor-toolbar i.separator {
            border-color: rgba(255, 255, 255, 0.08);
        }
        .EasyMDEContainer .editor-preview {
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 0 0 12px 12px;
            min-height: 400px;
            max-height: 500px;
            overflow-y: auto;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.2);
            color: #2D2D4A;
            font-size: 0.9rem;
            line-height: 1.8;
        }
        body.dark .EasyMDEContainer .editor-preview {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.05);
            color: #D0CAF0;
        }
        .EasyMDEContainer .editor-preview h1,
        .EasyMDEContainer .editor-preview h2,
        .EasyMDEContainer .editor-preview h3,
        .EasyMDEContainer .editor-preview h4,
        .EasyMDEContainer .editor-preview h5,
        .EasyMDEContainer .editor-preview h6 {
            margin: 0.6rem 0 0.3rem 0;
            font-weight: 700;
            color: #1A1A2E;
        }
        body.dark .EasyMDEContainer .editor-preview h1,
        body.dark .EasyMDEContainer .editor-preview h2,
        body.dark .EasyMDEContainer .editor-preview h3,
        body.dark .EasyMDEContainer .editor-preview h4,
        body.dark .EasyMDEContainer .editor-preview h5,
        body.dark .EasyMDEContainer .editor-preview h6 {
            color: #E8E6F0;
        }
        .EasyMDEContainer .editor-preview p {
            margin-bottom: 0.5rem;
        }
        .EasyMDEContainer .editor-preview code {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 0.85em;
            background: rgba(0, 0, 0, 0.06);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
        }
        body.dark .EasyMDEContainer .editor-preview code {
            background: rgba(255, 255, 255, 0.06);
        }
        .EasyMDEContainer .editor-preview pre {
            background: #0D1117;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            overflow: auto;
            margin: 0.5rem 0;
        }
        .EasyMDEContainer .editor-preview pre code {
            background: transparent;
            padding: 0;
            color: #E6EDF3;
        }
        .EasyMDEContainer .editor-preview blockquote {
            border-left: 3px solid #6B5ACF;
            padding-left: 1rem;
            margin: 0.5rem 0;
            color: #6A6A92;
            font-style: italic;
        }
        body.dark .EasyMDEContainer .editor-preview blockquote {
            border-left-color: #88ccff;
            color: #A8A4C8;
        }
        .EasyMDEContainer .editor-preview img {
            max-width: 100%;
            border-radius: 8px;
            margin: 0.5rem 0;
        }
        .EasyMDEContainer .editor-preview ul,
        .EasyMDEContainer .editor-preview ol {
            padding-left: 1.5rem;
            margin: 0.4rem 0;
        }
        .EasyMDEContainer .editor-preview table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin: 0.5rem 0;
        }
        .EasyMDEContainer .editor-preview th,
        .EasyMDEContainer .editor-preview td {
            border: 1px solid rgba(0, 0, 0, 0.08);
            padding: 0.3rem 0.6rem;
            text-align: left;
        }
        body.dark .EasyMDEContainer .editor-preview th,
        body.dark .EasyMDEContainer .editor-preview td {
            border-color: rgba(255, 255, 255, 0.06);
        }
        .EasyMDEContainer .editor-preview th {
            background: rgba(0, 0, 0, 0.04);
            font-weight: 600;
        }
        body.dark .EasyMDEContainer .editor-preview th {
            background: rgba(255, 255, 255, 0.04);
        }
        .EasyMDEContainer .editor-preview hr {
            border: none;
            border-top: 2px solid rgba(0, 0, 0, 0.08);
            margin: 1rem 0;
        }
        body.dark .EasyMDEContainer .editor-preview hr {
            border-top-color: rgba(255, 255, 255, 0.08);
        }
        .editor-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .editor-actions button {
            padding: 0.7rem 1.8rem;
            border: none;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.25s ease;
        }
        .editor-actions .btn-publish {
            background: linear-gradient(145deg, #7A6BCF, #624ED0);
            color: #fff;
            box-shadow: 0 8px 24px rgba(90, 70, 170, 0.25);
        }
        .editor-actions .btn-publish:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(90, 70, 170, 0.35);
        }
        body.dark .editor-actions .btn-publish {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .editor-actions .btn-publish:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .editor-actions .btn-save-draft {
            background: rgba(0, 0, 0, 0.06);
            color: #6A6A92;
        }
        body.dark .editor-actions .btn-save-draft {
            background: rgba(255, 255, 255, 0.08);
            color: #9A96B8;
        }
        .editor-actions .btn-save-draft:hover {
            background: rgba(0, 0, 0, 0.1);
        }
        body.dark .editor-actions .btn-save-draft:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .editor-actions .btn-cancel {
            background: transparent;
            color: #8A8AB5;
        }
        .editor-actions .btn-cancel:hover {
            color: #4A4A6E;
        }
        body.dark .editor-actions .btn-cancel:hover {
            color: #D0CAF0;
        }
        .list-controls {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            align-items: center;
        }
        .list-controls .filter-btn {
            padding: 0.3rem 1rem;
            border: none;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.3);
            color: #6A6A92;
            transition: 0.2s ease;
        }

    <script>
        const PASSWORD = 'QwQ20141031.';
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle.querySelector('i');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let currentTheme = localStorage.getItem('ks-theme') || (prefersDark ? 'dark' : 'light');

        function setTheme(theme) {
            document.body.classList.toggle('dark', theme === 'dark');
            themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('ks-theme', theme);
            currentTheme = theme;
        }
        setTheme(currentTheme);
        themeToggle.addEventListener('click', function() {
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        const toastEl = document.getElementById('toast');
        let toastTimer = null;

        function showToast(msg, isError) {
            toastEl.textContent = msg;
            toastEl.className = 'toast';
            if (isError) toastEl.classList.add('error');
            clearTimeout(toastTimer);
            void toastEl.offsetWidth;
            toastEl.classList.add('show');
            toastTimer = setTimeout(function() {
                toastEl.classList.remove('show');
            }, 3000);
        }

        const loginScreen = document.getElementById('loginScreen');
        const mainApp = document.getElementById('mainApp');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        function checkLogin() {
            const session = sessionStorage.getItem('admin_logged_in');
            if (session === 'true') {
                loginScreen.classList.add('hidden');
                mainApp.classList.add('active');
                loadAll();
                return true;
            }
            return false;
        }

        async function doLogin() {
            const pwd = passwordInput.value.trim();
            if (!pwd) {
                loginError.textContent = '请输入密码';
                return;
            }
            loginBtn.disabled = true;
            loginError.textContent = '';
            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'X-Admin-Password': pwd, 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const data = await res.json();
                if (data.success) {
                    sessionStorage.setItem('admin_logged_in', 'true');
                    sessionStorage.setItem('admin_password', pwd);
                    loginScreen.classList.add('hidden');
                    mainApp.classList.add('active');
                    loadAll();
                } else {
                    loginError.textContent = '密码错误';
                }
            } catch (e) {
                loginError.textContent = '网络错误，请重试';
            }
            loginBtn.disabled = false;
        }
        loginBtn.addEventListener('click', doLogin);
        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doLogin();
        });

        document.getElementById('logoutBtn').addEventListener('click', function() {
            sessionStorage.removeItem('admin_logged_in');
            sessionStorage.removeItem('admin_password');
            loginScreen.classList.remove('hidden');
            mainApp.classList.remove('active');
            passwordInput.value = '';
            loginError.textContent = '';
        });

        const tabs = document.querySelectorAll('.tab');
        const tabContents = {
            write: document.getElementById('tabWrite'),
            list: document.getElementById('tabList'),
            drafts: document.getElementById('tabDrafts')
        };
        tabs.forEach(function(tab) {
            tab.addEventListener('click', function() {
                tabs.forEach(function(t) { t.classList.remove('active'); });
                this.classList.add('active');
                const target = this.dataset.tab;
                Object.keys(tabContents).forEach(function(key) {
                    tabContents[key].classList.toggle('active', key === target);
                });
                if (target === 'list') renderArticleList();
                if (target === 'drafts') renderDraftList();
            });
        });

        // EasyMDE 初始化
        const easyMDE = new EasyMDE({
            element: document.getElementById('mdEditor'),
            spellChecker: false,
            autofocus: true,
            indentWithTabs: false,
            tabSize: 2,
            placeholder: '用 Markdown 写文章...',
            previewRender: function(plainText) {
                return plainText;
            },
            renderingConfig: {
                codeSyntaxHighlighting: true,
                hljs: hljs
            },
            toolbar: [
                'bold', 'italic', 'strikethrough', 'heading', '|',
                'quote', 'unordered-list', 'ordered-list', '|',
                'link', 'image', '|',
                'code', 'code-block', 'table', 'horizontal-rule', '|',
                'preview', 'side-by-side', 'fullscreen', '|',
                'guide'
            ]
        });

        let editingIdx = -1;

        function getEditorContent() {
            return easyMDE.value();
        }

        function setEditorContent(content) {
            easyMDE.value(content || '');
        }

        function updatePreview() {}

        function getPassword() {
            return sessionStorage.getItem('admin_password') || PASSWORD;
        }

        async function apiCall(endpoint, options) {
            const defaultOptions = {
                headers: {
                    'X-Admin-Password': getPassword(),
                    'Content-Type': 'application/json'
                }
            };
            const merged = {
                ...defaultOptions,
                ...options,
                headers: { ...defaultOptions.headers, ...(options?.headers || {}) }
            };
            const res = await fetch('/api/' + endpoint, merged);
            if (res.status === 401) {
                showToast('登录已过期，请重新登录', true);
                sessionStorage.removeItem('admin_logged_in');
                loginScreen.classList.remove('hidden');
                mainApp.classList.remove('active');
                throw new Error('Unauthorized');
            }
            return res;
        }

        let allArticles = [];
        let currentFilter = 'all';
        let currentSort = 'desc';
        let allDrafts = [];

        async function loadAll() {
            await loadArticles();
            renderArticleList();
            await loadDrafts();
            renderDraftList();
            updateBadges();
        }

        async function loadArticles() {
            try {
                const res = await apiCall('posts', { method: 'GET' });
                const data = await res.json();
                allArticles = data.announcements || [];
            } catch (e) {
                showToast('加载文章失败', true);
                allArticles = [];
            }
        }

        async function loadDrafts() {
            try {
                const res = await apiCall('drafts', { method: 'GET' });
                const data = await res.json();
                allDrafts = data.drafts || [];
            } catch (e) {
                allDrafts = [];
            }
        }

        function getFilteredArticles(filter) {
            let result = allArticles.slice();
            if (filter === 'published') {
                result = result.filter(function(a) { return !a.delete; });
            } else if (filter === 'deleted') {
                result = result.filter(function(a) { return a.delete; });
            }
            if (currentSort === 'desc') {
                result.sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });
            } else {
                result.sort(function(a, b) { return (a.date || '').localeCompare(b.date || ''); });
            }
            return result;
        }

        function renderArticleList() {
            const list = document.getElementById('articleList');
            const search = document.getElementById('listSearch').value.trim().toLowerCase();
            let filtered = getFilteredArticles(currentFilter);
            if (search) {
                filtered = filtered.filter(function(a) {
                    const title = (a.title || '').toLowerCase();
                    const content = (a.content || '').toLowerCase();
                    return title.indexOf(search) !== -1 || content.indexOf(search) !== -1;
                });
            }
            document.getElementById('listCount').textContent = filtered.length + ' 篇';
            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty">没有文章</div>';
                return;
            }
            let html = '';
            filtered.forEach(function(article) {
                const idx = allArticles.indexOf(article);
                const tags = article.tags || [];
                const tagsHtml = tags.map(function(t) {
                    return '<span class="tag">' + escapeHtml(t) + '</span>';
                }).join(' ');
                const deletedClass = article.delete ? 'deleted' : '';
                const statusHtml = article.delete ? '<span class="status-deleted">已删除</span>' : '';
                html += `
                    <div class="article-item-admin ${deletedClass}">
                        <div class="item-info">
                            <div class="item-title">${escapeHtml(article.title || '无标题')}</div>
                            <div class="item-meta">
                                ${article.date || ''}
                                ${tagsHtml}
                                ${statusHtml}
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="btn-edit" data-idx="${idx}">编辑</button>
                            ${article.delete ?
                                '<button class="btn-restore" data-idx="' + idx + '">恢复</button>' :
                                '<button class="btn-soft-delete" data-idx="' + idx + '">软删除</button>'
                            }
                            <button class="btn-hard-delete" data-idx="${idx}" data-title="${escapeHtml(article.title || '无标题')}">硬删除</button>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
            list.querySelectorAll('.btn-edit').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    editArticle(idx);
                });
            });
            list.querySelectorAll('.btn-soft-delete').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    softDeleteArticle(idx);
                });
            });
            list.querySelectorAll('.btn-restore').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    restoreArticle(idx);
                });
            });
            list.querySelectorAll('.btn-hard-delete').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    const title = this.dataset.title;
                    showHardDeleteModal(idx, title);
                });
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function editArticle(idx) {
            const article = allArticles[idx];
            if (!article) return;
            editingIdx = idx;
            document.getElementById('editTitle').value = article.title || '';
            document.getElementById('editTags').value = (article.tags || []).join('，');
            setEditorContent(article.content || '');
            document.querySelector('.tab[data-tab="write"]').click();
            showToast('已加载文章，修改后点发布更新');
        }

        async function softDeleteArticle(idx) {
            if (!confirm('确定要软删除这篇文章吗？')) return;
            try {
                const res = await apiCall('posts', {
                    method: 'DELETE',
                    body: JSON.stringify({ id: idx })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('已软删除');
                    await loadArticles();
                    renderArticleList();
                    updateBadges();
                } else {
                    showToast(data.error || '删除失败', true);
                }
            } catch (e) {
                showToast('删除失败', true);
            }
        }

        async function restoreArticle(idx) {
            try {
                const res = await apiCall('posts', {
                    method: 'DELETE',
                    body: JSON.stringify({ id: idx, restore: true })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('已恢复');
                    await loadArticles();
                    renderArticleList();
                    updateBadges();
                } else {
                    showToast(data.error || '恢复失败', true);
                }
            } catch (e) {
                showToast('恢复失败', true);
            }
        }

        let hardDeleteTarget = -1;
        const hardDeleteOverlay = document.getElementById('hardDeleteOverlay');
        const hardDeleteTitle = document.getElementById('hardDeleteTitle');
        const hardDeleteConfirm = document.getElementById('hardDeleteConfirm');
        const hardDeleteConfirmBtn = document.getElementById('hardDeleteConfirmBtn');
        const hardDeleteCancel = document.getElementById('hardDeleteCancel');

        function showHardDeleteModal(idx, title) {
            hardDeleteTarget = idx;
            hardDeleteTitle.textContent = title;
            hardDeleteConfirm.value = '';
            hardDeleteConfirmBtn.disabled = true;
            hardDeleteOverlay.classList.add('active');
            hardDeleteConfirm.focus();
        }

        hardDeleteConfirm.addEventListener('input', function() {
            hardDeleteConfirmBtn.disabled = this.value !== '删除';
        });

        hardDeleteConfirm.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !hardDeleteConfirmBtn.disabled) {
                confirmHardDelete();
            }
            if (e.key === 'Escape') {
                closeHardDeleteModal();
            }
        });

        hardDeleteCancel.addEventListener('click', closeHardDeleteModal);
        hardDeleteConfirmBtn.addEventListener('click', confirmHardDelete);
        hardDeleteOverlay.addEventListener('click', function(e) {
            if (e.target === this) closeHardDeleteModal();
        });

        function closeHardDeleteModal() {
            hardDeleteOverlay.classList.remove('active');
            hardDeleteTarget = -1;
            hardDeleteConfirm.value = '';
            hardDeleteConfirmBtn.disabled = true;
        }

        async function confirmHardDelete() {
            if (hardDeleteTarget === -1) return;
            try {
                const res = await apiCall('posts', {
                    method: 'DELETE',
                    body: JSON.stringify({ id: hardDeleteTarget, hard: true })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('已硬删除');
                    closeHardDeleteModal();
                    await loadArticles();
                    renderArticleList();
                    updateBadges();
                } else {
                    showToast(data.error || '硬删除失败', true);
                }
            } catch (e) {
                showToast('硬删除失败', true);
            }
        }

        function renderDraftList() {
            const list = document.getElementById('draftList');
            if (allDrafts.length === 0) {
                list.innerHTML = '<div class="empty">没有草稿</div>';
                return;
            }
            let html = '';
            allDrafts.forEach(function(draft) {
                const preview = (draft.content || '').replace(/\n/g, ' ').slice(0, 80) + (draft.content && draft.content
                    .length > 80 ? '...' : '');
                html += `
                    <div class="draft-item">
                        <div class="draft-info">
                            <div class="draft-title">${escapeHtml(draft.title || '无标题')}</div>
                            <div class="draft-meta">创建于 ${draft.created || ''} ${draft.updated && draft.updated !== draft.created ? ' · 更新于 ' + draft.updated : ''}</div>
                            <div class="draft-preview">${escapeHtml(preview)}</div>
                        </div>
                        <div class="draft-actions">
                            <button class="btn-continue" data-id="${draft.id}">继续编辑</button>
                            <button class="btn-publish-draft" data-id="${draft.id}">发布</button>
                            <button class="btn-delete-draft" data-id="${draft.id}">删除</button>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
            list.querySelectorAll('.btn-continue').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    const draft = allDrafts.find(function(d) { return d.id === id; });
                    if (draft) {
                        document.getElementById('editTitle').value = draft.title || '';
                        document.getElementById('editTags').value = (draft.tags || []).join('，');
                        setEditorContent(draft.content || '');
                        editingIdx = -1;
                        document.querySelector('.tab[data-tab="write"]').click();
                        showToast('已加载草稿');
                    }
                });
            });
            list.querySelectorAll('.btn-publish-draft').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    const draft = allDrafts.find(function(d) { return d.id === id; });
                    if (draft) {
                        document.getElementById('editTitle').value = draft.title || '';
                        document.getElementById('editTags').value = (draft.tags || []).join('，');
                        setEditorContent(draft.content || '');
                        editingIdx = -1;
                        deleteDraft(id);
                        document.querySelector('.tab[data-tab="write"]').click();
                        document.getElementById('publishBtn').click();
                    }
                });
            });
            list.querySelectorAll('.btn-delete-draft').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    if (confirm('确定要删除这个草稿吗？')) {
                        deleteDraft(id);
                    }
                });
            });
        }

        async function deleteDraft(id) {
            try {
                const res = await apiCall('drafts', {
                    method: 'DELETE',
                    body: JSON.stringify({ id: id })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('草稿已删除');
                    await loadDrafts();
                    renderDraftList();
                    updateBadges();
                } else {
                    showToast(data.error || '删除失败', true);
                }
            } catch (e) {
                showToast('删除失败', true);
            }
        }

        document.getElementById('publishBtn').addEventListener('click', async function() {
            const title = document.getElementById('editTitle').value.trim();
            const content = getEditorContent().trim();
            const tagsRaw = document.getElementById('editTags').value.trim();
            const tags = tagsRaw ? tagsRaw.split(/[，,、\s]+/).filter(Boolean) : [];
            if (!title) {
                showToast('请输入标题', true);
                return;
            }
            if (!content) {
                showToast('请输入内容', true);
                return;
            }
            this.disabled = true;
            try {
                let res, data;
                if (editingIdx >= 0) {
                    res = await apiCall('posts', {
                        method: 'PUT',
                        body: JSON.stringify({
                            id: editingIdx,
                            title: title,
                            content: content,
                            tags: tags
                        })
                    });
                    data = await res.json();
                    if (data.success) {
                        showToast('文章已更新');
                        editingIdx = -1;
                        clearEditor();
                        await loadArticles();
                        renderArticleList();
                        updateBadges();
                    } else {
                        showToast(data.error || '更新失败', true);
                    }
                } else {
                    res = await apiCall('posts', {
                        method: 'POST',
                        body: JSON.stringify({ title, content, tags })
                    });
                    data = await res.json();
                    if (data.success) {
                        showToast('发布成功！');
                        clearEditor();
                        await loadArticles();
                        renderArticleList();
                        updateBadges();
                    } else {
                        showToast(data.error || '发布失败', true);
                    }
                }
            } catch (e) {
                showToast('请求失败', true);
            }
            this.disabled = false;
        });

        function clearEditor() {
            document.getElementById('editTitle').value = '';
            document.getElementById('editTags').value = '';
            setEditorContent('');
            editingIdx = -1;
        }

        document.getElementById('cancelEditBtn').addEventListener('click', function() {
            if (editingIdx >= 0 || getEditorContent() || document.getElementById('editTitle').value) {
                if (!confirm('确定要清空当前内容吗？')) return;
            }
            clearEditor();
        });

        document.getElementById('saveDraftBtn').addEventListener('click', async function() {
            const title = document.getElementById('editTitle').value.trim() || '无标题';
            const content = getEditorContent();
            const tagsRaw = document.getElementById('editTags').value.trim();
            const tags = tagsRaw ? tagsRaw.split(/[，,、\s]+/).filter(Boolean) : [];
            if (!content) {
                showToast('内容为空，无需保存', true);
                return;
            }
            this.disabled = true;
            try {
                const res = await apiCall('drafts', {
                    method: 'POST',
                    body: JSON.stringify({ title, content, tags })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('草稿已保存');
                    await loadDrafts();
                    renderDraftList();
                    updateBadges();
                } else {
                    showToast(data.error || '保存失败', true);
                }
            } catch (e) {
                showToast('保存失败', true);
            }
            this.disabled = false;
        });

        document.querySelectorAll('#tabList .filter-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#tabList .filter-btn').forEach(function(b) {
                    b.classList.remove('active');
                });
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderArticleList();
            });
        });

        document.getElementById('sortBtn').addEventListener('click', function() {
            currentSort = currentSort === 'desc' ? 'asc' : 'desc';
            this.innerHTML = currentSort === 'desc' ?
                '<i class="fas fa-sort-amount-down"></i> 倒序' :
                '<i class="fas fa-sort-amount-up"></i> 正序';
            renderArticleList();
        });

        document.getElementById('listSearch').addEventListener('input', function() {
            renderArticleList();
        });

        function updateBadges() {
            const published = allArticles.filter(function(a) { return !a.delete; }).length;
            const deleted = allArticles.filter(function(a) { return a.delete; }).length;
            document.getElementById('listBadge').textContent = allArticles.length;
            document.getElementById('draftBadge').textContent = allDrafts.length;
        }

        if (checkLogin()) {
            // 已登录，loadAll 在 checkLogin 里调用
        } else {
            loginScreen.classList.remove('hidden');
            mainApp.classList.remove('active');
        }
    </script>
</body>
</html>
