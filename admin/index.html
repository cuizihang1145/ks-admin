<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理后台 · ks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js">
    </script>
    <style>
        /* ===== Reset ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #FAFAFE;
            color: #1A1A2E;
            min-height: 100vh;
            transition: background 0.4s ease, color 0.3s ease;
        }

        body.dark {
            background: #14131F;
            color: #E8E6F0;
        }

        /* ===== 背景光效 ===== */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 30% 30%, #F6F2FF, #FFFFFF);
            transition: background 0.5s ease;
        }
        body.dark .bg-glow {
            background: radial-gradient(circle at 30% 30%, #28253D, #0E0D18);
        }

        .glow-soft {
            position: fixed;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(160, 130, 230, 0.15), rgba(210, 190, 255, 0) 70%);
            border-radius: 50%;
            top: -25vh;
            right: -20vw;
            z-index: -1;
            filter: blur(80px);
            animation: floatGlow 20s infinite alternate ease-in-out;
            transition: background 0.5s ease;
        }
        body.dark .glow-soft {
            background: radial-gradient(circle, rgba(120, 100, 200, 0.20), rgba(60, 40, 120, 0) 70%);
        }

        .glow-soft-2 {
            position: fixed;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(200, 180, 255, 0.10), rgba(255, 240, 255, 0) 70%);
            border-radius: 50%;
            bottom: -15vh;
            left: -10vw;
            z-index: -1;
            filter: blur(70px);
            animation: floatGlow2 22s infinite alternate ease-in-out;
            transition: background 0.5s ease;
        }
        body.dark .glow-soft-2 {
            background: radial-gradient(circle, rgba(90, 70, 160, 0.15), rgba(30, 20, 60, 0) 70%);
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            100% { transform: translate(5%, 8%) scale(1.2); opacity: 0.7; }
        }
        @keyframes floatGlow2 {
            0% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            100% { transform: translate(-6%, -5%) scale(1.3); opacity: 0.6; }
        }

        /* ===== 主题切换按钮 ===== */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 60px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #4F4F78;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 6px 20px rgba(80, 60, 160, 0.10);
            user-select: none;
        }
        .theme-toggle:hover {
            transform: scale(1.05) rotate(8deg);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 10px 28px rgba(80, 60, 160, 0.18);
        }
        body.dark .theme-toggle {
            background: rgba(30, 28, 50, 0.7);
            border-color: rgba(255, 255, 255, 0.08);
            color: #D0CAF0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        body.dark .theme-toggle:hover {
            background: rgba(50, 45, 80, 0.8);
        }

        /* ===== 容器 ===== */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1.5rem 2rem;
            min-height: 100vh;
            position: relative;
        }

        /* ===== 登录界面 ===== */
        #loginScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        #loginScreen.hidden {
            display: none;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2.8rem 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 24px 60px rgba(80, 60, 160, 0.10);
            width: 100%;
            max-width: 380px;
            text-align: center;
            transition: background 0.4s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        body.dark .login-card {
            background: rgba(30, 28, 50, 0.50);
            border-color: rgba(255, 255, 255, 0.06);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.30);
        }

        .login-card h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
            background: linear-gradient(135deg, #201D3A, #5B4DAF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        body.dark .login-card h1 {
            background: linear-gradient(135deg, #C8C0F0, #8F7BE0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .login-card .sub {
            color: #8A8AB5;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }
        body.dark .login-card .sub {
            color: #9A96B8;
        }

        .login-card input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border-radius: 60px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            color: #1A1A2E;
            transition: 0.3s ease;
            margin-bottom: 1rem;
        }
        body.dark .login-card input {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: #E8E6F0;
        }
        .login-card input:focus {
            outline: none;
            border-color: #6B5ACF;
            box-shadow: 0 0 0 3px rgba(107, 90, 207, 0.15);
        }

        .login-card .btn-login {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 60px;
            background: linear-gradient(145deg, #7A6BCF, #624ED0);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 8px 24px rgba(90, 70, 170, 0.25);
        }
        .login-card .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(90, 70, 170, 0.35);
        }
        body.dark .login-card .btn-login {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .login-card .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .login-card .error-msg {
            color: #E57373;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            min-height: 1.5rem;
        }

        /* ===== 主界面 ===== */
        #mainApp {
            display: none;
        }
        #mainApp.active {
            display: block;
        }

        /* ===== 顶部栏 ===== */
        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .admin-header .title {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #201D3A, #5B4DAF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        body.dark .admin-header .title {
            background: linear-gradient(135deg, #C8C0F0, #8F7BE0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .admin-header .right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .admin-header .btn-logout {
            padding: 0.4rem 1.2rem;
            border: none;
            border-radius: 60px;
            background: rgba(0, 0, 0, 0.06);
            color: #6A6A92;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.2s ease;
        }
        body.dark .admin-header .btn-logout {
            background: rgba(255, 255, 255, 0.08);
            color: #9A96B8;
        }
        .admin-header .btn-logout:hover {
            background: rgba(0, 0, 0, 0.1);
        }
        body.dark .admin-header .btn-logout:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ===== Tabs ===== */
        .tabs {
            display: flex;
            gap: 0.3rem;
            background: rgba(255, 255, 255, 0.20);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 1.5rem;
            overflow-x: auto;
        }
        body.dark .tabs {
            background: rgba(40, 38, 65, 0.30);
            border-color: rgba(255, 255, 255, 0.06);
        }

        .tabs .tab {
            padding: 0.6rem 1.4rem;
            border: none;
            border-radius: 60px;
            background: transparent;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            color: #6A6A92;
            cursor: pointer;
            transition: 0.25s ease;
            white-space: nowrap;
        }
        body.dark .tabs .tab {
            color: #9A96B8;
        }
        .tabs .tab:hover {
            color: #3D2D8A;
        }
        body.dark .tabs .tab:hover {
            color: #C8C0F0;
        }
        .tabs .tab.active {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            color: #3D2D8A;
            box-shadow: 0 4px 16px rgba(80, 60, 160, 0.08);
        }
        body.dark .tabs .tab.active {
            background: rgba(60, 55, 100, 0.55);
            color: #C8C0F0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        .tabs .tab .badge {
            display: inline-block;
            background: rgba(107, 90, 207, 0.15);
            color: #6B5ACF;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.05rem 0.5rem;
            border-radius: 40px;
            margin-left: 0.3rem;
        }
        body.dark .tabs .tab .badge {
            background: rgba(136, 204, 255, 0.12);
            color: #88ccff;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== 写文章 ===== */
        .editor-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }
        @media (max-width: 768px) {
            .editor-section {
                grid-template-columns: 1fr;
            }
        }

        .editor-panel {
            background: rgba(255, 255, 255, 0.40);
            backdrop-filter: blur(8px);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: background 0.4s ease, border-color 0.3s ease;
        }
        body.dark .editor-panel {
            background: rgba(40, 38, 65, 0.30);
            border-color: rgba(255, 255, 255, 0.05);
        }

        .editor-panel .panel-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #8A8AB5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.6rem;
        }
        body.dark .editor-panel .panel-label {
            color: #7A7AA0;
        }

        .editor-panel input,
        .editor-panel .tag-input-wrap {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.5);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            color: #1A1A2E;
            transition: 0.3s ease;
            margin-bottom: 0.8rem;
        }
        body.dark .editor-panel input,
        body.dark .editor-panel .tag-input-wrap {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: #E8E6F0;
        }
        .editor-panel input:focus {
            outline: none;
            border-color: #6B5ACF;
            box-shadow: 0 0 0 3px rgba(107, 90, 207, 0.10);
        }

        /* ===== Markdown 编辑器 ===== */
        .md-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem;
            margin-bottom: 0.4rem;
            padding: 0.2rem;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 8px;
        }
        body.dark .md-toolbar {
            background: rgba(255, 255, 255, 0.04);
        }
        .md-toolbar button {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #6A6A92;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.15s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        body.dark .md-toolbar button {
            color: #9A96B8;
        }
        .md-toolbar button:hover {
            background: rgba(107, 90, 207, 0.10);
            color: #6B5ACF;
        }
        body.dark .md-toolbar button:hover {
            background: rgba(136, 204, 255, 0.10);
            color: #88ccff;
        }
        .md-toolbar .sep {
            width: 1px;
            background: rgba(0, 0, 0, 0.08);
            margin: 0 0.2rem;
        }
        body.dark .md-toolbar .sep {
            background: rgba(255, 255, 255, 0.08);
        }

        .md-editor {
            width: 100%;
            min-height: 320px;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            color: #1A1A2E;
            resize: vertical;
            transition: 0.3s ease;
            line-height: 1.7;
        }
        body.dark .md-editor {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: #E8E6F0;
        }
        .md-editor:focus {
            outline: none;
            border-color: #6B5ACF;
            box-shadow: 0 0 0 3px rgba(107, 90, 207, 0.10);
        }

        .preview-area {
            min-height: 320px;
            max-height: 500px;
            overflow-y: auto;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
            line-height: 1.8;
            color: #2D2D4A;
            transition: background 0.4s ease, border-color 0.3s ease, color 0.3s ease;
        }
        body.dark .preview-area {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.05);
            color: #D0CAF0;
        }
        .preview-area h1,
        .preview-area h2,
        .preview-area h3,
        .preview-area h4,
        .preview-area h5,
        .preview-area h6 {
            margin: 0.6rem 0 0.3rem 0;
            font-weight: 700;
            color: #1A1A2E;
        }
        body.dark .preview-area h1,
        body.dark .preview-area h2,
        body.dark .preview-area h3,
        body.dark .preview-area h4,
        body.dark .preview-area h5,
        body.dark .preview-area h6 {
            color: #E8E6F0;
        }
        .preview-area p {
            margin-bottom: 0.5rem;
        }
        .preview-area code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            background: rgba(0, 0, 0, 0.06);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
        }
        body.dark .preview-area code {
            background: rgba(255, 255, 255, 0.06);
        }
        .preview-area pre {
            background: #0D1117;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            overflow: auto;
            margin: 0.5rem 0;
        }
        .preview-area pre code {
            background: transparent;
            padding: 0;
            color: #E6EDF3;
        }
        .preview-area blockquote {
            border-left: 3px solid #6B5ACF;
            padding-left: 1rem;
            margin: 0.5rem 0;
            color: #6A6A92;
            font-style: italic;
        }
        body.dark .preview-area blockquote {
            border-left-color: #88ccff;
            color: #A8A4C8;
        }
        .preview-area img {
            max-width: 100%;
            border-radius: 8px;
            margin: 0.5rem 0;
        }
        .preview-area ul,
        .preview-area ol {
            padding-left: 1.5rem;
            margin: 0.4rem 0;
        }
        .preview-area table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin: 0.5rem 0;
        }
        .preview-area th,
        .preview-area td {
            border: 1px solid rgba(0, 0, 0, 0.08);
            padding: 0.3rem 0.6rem;
            text-align: left;
        }
        body.dark .preview-area th,
        body.dark .preview-area td {
            border-color: rgba(255, 255, 255, 0.06);
        }
        .preview-area th {
            background: rgba(0, 0, 0, 0.04);
            font-weight: 600;
        }
        body.dark .preview-area th {
            background: rgba(255, 255, 255, 0.04);
        }

        .editor-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .editor-actions button {
            padding: 0.7rem 1.8rem;
            border: none;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.25s ease;
        }
        .editor-actions .btn-publish {
            background: linear-gradient(145deg, #7A6BCF, #624ED0);
            color: #fff;
            box-shadow: 0 8px 24px rgba(90, 70, 170, 0.25);
        }
        .editor-actions .btn-publish:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(90, 70, 170, 0.35);
        }
        body.dark .editor-actions .btn-publish {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .editor-actions .btn-publish:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .editor-actions .btn-save-draft {
            background: rgba(0, 0, 0, 0.06);
            color: #6A6A92;
        }
        body.dark .editor-actions .btn-save-draft {
            background: rgba(255, 255, 255, 0.08);
            color: #9A96B8;
        }
        .editor-actions .btn-save-draft:hover {
            background: rgba(0, 0, 0, 0.1);
        }
        body.dark .editor-actions .btn-save-draft:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .editor-actions .btn-cancel {
            background: transparent;
            color: #8A8AB5;
        }
        .editor-actions .btn-cancel:hover {
            color: #4A4A6E;
        }
        body.dark .editor-actions .btn-cancel:hover {
            color: #D0CAF0;
        }

        /* ===== 文章列表 ===== */
        .list-controls {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            align-items: center;
        }
        .list-controls .filter-btn {
            padding: 0.3rem 1rem;
            border: none;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.3);
            color: #6A6A92;
            transition: 0.2s ease;
        }
        body.dark .list-controls .filter-btn {
            background: rgba(40, 38, 65, 0.3);
            color: #9A96B8;
        }
        .list-controls .filter-btn.active {
            background: #6B5ACF;
            color: #fff;
        }
        body.dark .list-controls .filter-btn.active {
            background: #7A6BCF;
        }
        .list-controls .filter-btn:hover:not(.active) {
            background: rgba(107, 90, 207, 0.15);
        }

        .list-controls .search-input {
            padding: 0.3rem 1rem;
            border-radius: 40px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            color: #1A1A2E;
            flex: 1;
            min-width: 150px;
            transition: 0.3s ease;
        }
        body.dark .list-controls .search-input {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: #E8E6F0;
        }
        .list-controls .search-input:focus {
            outline: none;
            border-color: #6B5ACF;
        }

        .list-controls .count-badge {
            font-size: 0.75rem;
            color: #8A8AB5;
            margin-left: auto;
        }
        body.dark .list-controls .count-badge {
            color: #7A7AA0;
        }

        .article-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .article-list .empty {

    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="glow-soft"></div>
    <div class="glow-soft-2"></div>

    <div class="theme-toggle" id="themeToggle" role="button" aria-label="切换深色/亮色模式">
        <i class="fas fa-moon"></i>
    </div>

    <div class="container">

        <!-- ===== 登录界面 ===== -->
        <div id="loginScreen">
            <div class="login-card">
                <h1>管理后台</h1>
                <p class="sub">ks · 内容管理</p>
                <input type="password" id="passwordInput" placeholder="请输入密码" autocomplete="current-password" />
                <button class="btn-login" id="loginBtn">登录</button>
                <div class="error-msg" id="loginError"></div>
            </div>
        </div>

        <!-- ===== 主应用 ===== -->
        <div id="mainApp">
            <div class="admin-header">
                <span class="title">管理后台</span>
                <div class="right">
                    <button class="btn-logout" id="logoutBtn">退出</button>
                </div>
            </div>

            <div class="tabs" id="tabs">
                <button class="tab active" data-tab="write">写文章</button>
                <button class="tab" data-tab="list">文章列表 <span class="badge" id="listBadge">0</span></button>
                <button class="tab" data-tab="drafts">草稿箱 <span class="badge" id="draftBadge">0</span></button>
            </div>

            <!-- Tab: 写文章 -->
            <div class="tab-content active" id="tabWrite">
                <div class="editor-section">
                    <div class="editor-panel">
                        <div class="panel-label">编辑</div>
                        <input type="text" id="editTitle" placeholder="文章标题" />
                        <div class="tag-input-wrap">
                            <input type="text" id="editTags" placeholder="标签，用逗号分隔" style="border:none;background:transparent;padding:0;width:100%;font-family:inherit;font-size:0.95rem;color:inherit;outline:none;" />
                        </div>
                        <div class="md-toolbar" id="mdToolbar">
                            <button data-cmd="bold" title="粗体"><b>B</b></button>
                            <button data-cmd="italic" title="斜体"><i>I</i></button>
                            <button data-cmd="strike" title="删除线"><s>S</s></button>
                            <span class="sep"></span>
                            <button data-cmd="h1" title="一级标题">H1</button>
                            <button data-cmd="h2" title="二级标题">H2</button>
                            <button data-cmd="h3" title="三级标题">H3</button>
                            <span class="sep"></span>
                            <button data-cmd="link" title="链接"><i class="fas fa-link"></i></button>
                            <button data-cmd="image" title="图片"><i class="fas fa-image"></i></button>
                            <span class="sep"></span>
                            <button data-cmd="code" title="行内代码">&lt;/&gt;</button>
                            <button data-cmd="codeblock" title="代码块"><i class="fas fa-code"></i></button>
                            <span class="sep"></span>
                            <button data-cmd="quote" title="引用"><i class="fas fa-quote-left"></i></button>
                            <button data-cmd="ul" title="无序列表"><i class="fas fa-list-ul"></i></button>
                            <button data-cmd="ol" title="有序列表"><i class="fas fa-list-ol"></i></button>
                        </div>
                        <textarea class="md-editor" id="mdEditor" placeholder="用 Markdown 写文章..."></textarea>
                        <div class="editor-actions">
                            <button class="btn-publish" id="publishBtn">发布文章</button>
                            <button class="btn-save-draft" id="saveDraftBtn">存草稿</button>
                            <button class="btn-cancel" id="cancelEditBtn">清空</button>
                        </div>
                    </div>
                    <div class="editor-panel">
                        <div class="panel-label">预览</div>
                        <div class="preview-area" id="previewArea">
                            <span style="color:#8A8AB5;font-size:0.85rem;">预览会显示在这里</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tab: 文章列表 -->
            <div class="tab-content" id="tabList">
                <div class="list-controls">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="published">已发布</button>
                    <button class="filter-btn" data-filter="deleted">已删除</button>
                    <input class="search-input" id="listSearch" placeholder="搜索文章..." />
                    <span class="count-badge" id="listCount">0 篇</span>
                </div>
                <div class="article-list" id="articleList"></div>
            </div>

            <!-- Tab: 草稿箱 -->
            <div class="tab-content" id="tabDrafts">
                <div class="article-list" id="draftList"></div>
            </div>
        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // 配置
        // ============================================================
        const API_BASE = ''; // 空字符串表示同域，Vercel 会自动路由
        const PASSWORD = 'QwQ20141031.';

        // ============================================================
        // 主题切换
        // ============================================================
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle.querySelector('i');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let currentTheme = localStorage.getItem('ks-theme') || (prefersDark ? 'dark' : 'light');

        function setTheme(theme) {
            document.body.classList.toggle('dark', theme === 'dark');
            themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('ks-theme', theme);
            currentTheme = theme;
        }
        setTheme(currentTheme);
        themeToggle.addEventListener('click', function() {
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        // ============================================================
        // Toast
        // ============================================================
        const toastEl = document.getElementById('toast');
        let toastTimer = null;

        function showToast(msg, isError) {
            toastEl.textContent = msg;
            toastEl.className = 'toast';
            if (isError) toastEl.classList.add('error');
            clearTimeout(toastTimer);
            // 触发重排以重启动画
            void toastEl.offsetWidth;
            toastEl.classList.add('show');
            toastTimer = setTimeout(function() {
                toastEl.classList.remove('show');
            }, 3000);
        }

        // ============================================================
        // 登录
        // ============================================================
        const loginScreen = document.getElementById('loginScreen');
        const mainApp = document.getElementById('mainApp');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        function checkLogin() {
            const session = sessionStorage.getItem('admin_logged_in');
            if (session === 'true') {
                loginScreen.classList.add('hidden');
                mainApp.classList.add('active');
                loadAll();
                return true;
            }
            return false;
        }

        async function doLogin() {
            const pwd = passwordInput.value.trim();
            if (!pwd) {
                loginError.textContent = '请输入密码';
                return;
            }
            loginBtn.disabled = true;
            loginError.textContent = '';

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'X-Admin-Password': pwd, 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const data = await res.json();
                if (data.success) {
                    sessionStorage.setItem('admin_logged_in', 'true');
                    loginScreen.classList.add('hidden');
                    mainApp.classList.add('active');
                    loadAll();
                } else {
                    loginError.textContent = '密码错误';
                }
            } catch (e) {
                loginError.textContent = '网络错误，请重试';
            }
            loginBtn.disabled = false;
        }

        loginBtn.addEventListener('click', doLogin);
        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doLogin();
        });

        // ============================================================
        // 退出
        // ============================================================
        document.getElementById('logoutBtn').addEventListener('click', function() {
            sessionStorage.removeItem('admin_logged_in');
            loginScreen.classList.remove('hidden');
            mainApp.classList.remove('active');
            passwordInput.value = '';
            loginError.textContent = '';
        });

        // ============================================================
        // Tab 切换
        // ============================================================
        const tabs = document.querySelectorAll('.tab');
        const tabContents = {
            write: document.getElementById('tabWrite'),
            list: document.getElementById('tabList'),
            drafts: document.getElementById('tabDrafts')
        };

        tabs.forEach(function(tab) {
            tab.addEventListener('click', function() {
                tabs.forEach(function(t) { t.classList.remove('active'); });
                this.classList.add('active');
                const target = this.dataset.tab;
                Object.keys(tabContents).forEach(function(key) {
                    tabContents[key].classList.toggle('active', key === target);
                });
                if (target === 'list') renderArticleList();
                if (target === 'drafts') renderDraftList();
            });
        });

        // ============================================================
        // Markdown 工具栏
        // ============================================================
        const mdEditor = document.getElementById('mdEditor');

        document.querySelectorAll('#mdToolbar button[data-cmd]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const cmd = this.dataset.cmd;
                const start = mdEditor.selectionStart;
                const end = mdEditor.selectionEnd;
                const text = mdEditor.value;
                let selected = text.substring(start, end);
                let replacement = '';
                let cursorOffset = 0;

                switch (cmd) {
                    case 'bold':
                        replacement = '**' + selected + '**';
                        cursorOffset = 2;
                        break;
                    case 'italic':
                        replacement = '*' + selected + '*';
                        cursorOffset = 1;
                        break;
                    case 'strike':
                        replacement = '~~' + selected + '~~';
                        cursorOffset = 2;
                        break;
                    case 'h1':
                        replacement = '# ' + selected;
                        cursorOffset = 2;
                        break;
                    case 'h2':
                        replacement = '## ' + selected;
                        cursorOffset = 3;
                        break;
                    case 'h3':
                        replacement = '### ' + selected;
                        cursorOffset = 4;
                        break;
                    case 'link':
                        replacement = '[' + (selected || '链接文字') + '](url)';
                        cursorOffset = 1;
                        break;
                    case 'image':
                        replacement = '![' + (selected || '图片描述') + '](图片url)';
                        cursorOffset = 2;
                        break;
                    case 'code':
                        replacement = '`' + selected + '`';
                        cursorOffset = 1;
                        break;
                    case 'codeblock':
                        replacement = '\n```\n' + selected + '\n```\n';
                        cursorOffset = 4;
                        break;
                    case 'quote':
                        replacement = '> ' + selected;
                        cursorOffset = 2;
                        break;
                    case 'ul':
                        replacement = '- ' + selected;
                        cursorOffset = 2;
                        break;
                    case 'ol':
                        replacement = '1. ' + selected;
                        cursorOffset = 3;
                        break;
                    default:
                        return;
                }

                mdEditor.value = text.substring(0, start) + replacement + text.substring(end);
                const newPos = start + replacement.length;
                mdEditor.selectionStart = mdEditor.selectionEnd = newPos;
                mdEditor.focus();
                updatePreview();
            });
        });

        // ============================================================
        // 实时预览
        // ============================================================
        const previewArea = document.getElementById('previewArea');

        function updatePreview() {
            const text = mdEditor.value;
            previewArea.innerHTML = renderMarkdown(text);
            // 高亮代码块
            previewArea.querySelectorAll('pre code').forEach(function(el) {
                try { hljs.highlightElement(el); } catch (e) {}
            });
        }

        mdEditor.addEventListener('input', updatePreview);

        // ============================================================
        // 简单的 Markdown 渲染（足够预览用）
        // ============================================================
        function renderMarkdown(md) {
            if (!md) return '<span style="color:#8A8AB5;font-size:0.85rem;">预览会显示在这里</span>';
            let html = md;

            // 代码块
            html = html.replace(/```([\s\S]*?)```/g, function(match, code) {
                return '<pre><code>' + escapeHtml(code) + '</code></pre>';
            });

            // 行内代码
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // 粗体
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            // 斜体
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

            // 删除线
            html = html.replace(/~~(.*?)~~/g, '<del>$1</del>');

            // 标题
            html = html.replace(/^### (.*$)/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gm, '<h1>$1</h1>');

            // 引用
            html = html.replace(/^> (.*$)/gm, '<blockquote>$1</blockquote>');

            // 链接
            html = html.replace(/\[([^\]]*)\]\(([^)]*)\)/g, '<a href="$2" target="_blank">$1</a>');

            // 图片
            html = html.replace(/!\[([^\]]*)\]\(([^)]*)\)/g, '<img src="$2" alt="$1" />');

            // 无序列表
            html = html.replace(/^\- (.*$)/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');

            // 有序列表
            html = html.replace(/^\d+\. (.*$)/gm, '<li>$1</li>');

            // 换行
            html = html.replace(/\n/g, '<br />');

            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // 与 API 交互
        // ============================================================
        function getPassword() {
            return sessionStorage.getItem('admin_password') || PASSWORD;
        }

        async function apiCall(endpoint, options) {
            const defaultOptions = {
                headers: {
                    'X-Admin-Password': getPassword(),
                    'Content-Type': 'application/json'
                }
            };
            const merged = {
                ...defaultOptions,
                ...options,
                headers: { ...defaultOptions.headers, ...(options?.headers || {}) }
            };
            const res = await fetch('/api/' + endpoint, merged);
            if (res.status === 401) {
                showToast('登录已过期，请重新登录', true);
                sessionStorage.removeItem('admin_logged_in');
                loginScreen.classList.remove('hidden');
                mainApp.classList.remove('active');
                throw new Error('Unauthorized');
            }
            return res;
        }

        // ============================================================
        // 文章列表
        // ============================================================
        let allArticles = [];
        let currentFilter = 'all';

        async function loadAll() {
            await loadArticles();
            renderArticleList();
            renderDraftList();
            updateBadges();
        }

        async function loadArticles() {
            try {
                const res = await apiCall('posts', { method: 'GET' });
                const data = await res.json();
                allArticles = data.announcements || [];
            } catch (e) {
                showToast('加载文章失败', true);
                allArticles = [];
            }
        }

        function getFilteredArticles(filter) {
            if (filter === 'all') return allArticles;
            if (filter === 'published') return allArticles.filter(function(a) { return !a.delete; });
            if (filter === 'deleted') return allArticles.filter(function(a) { return a.delete; });
            return allArticles;
        }

        function renderArticleList() {
            const list = document.getElementById('articleList');
            const search = document.getElementById('listSearch').value.trim().toLowerCase();
            let filtered = getFilteredArticles(currentFilter);

            if (search) {
                filtered = filtered.filter(function(a) {
                    const title = (a.title || '').toLowerCase();
                    const content = (a.content || '').toLowerCase();
                    return title.indexOf(search) !== -1 || content.indexOf(search) !== -1;
                });
            }

            document.getElementById('listCount').textContent = filtered.length + ' 篇';

            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty">没有文章</div>';
                return;
            }

            let html = '';
            filtered.forEach(function(article, idx) {
                const realIdx = allArticles.indexOf(article);
                const tags = article.tags || [];
                const tagsHtml = tags.map(function(t) {
                    return '<span class="tag">' + escapeHtml(t) + '</span>';
                }).join(' ');

                const deletedClass = article.delete ? 'deleted' : '';
                const statusHtml = article.delete ? '<span class="status-deleted">已删除</span>' : '';

                html += `
                    <div class="article-item-admin ${deletedClass}">
                        <div class="item-info">
                            <div class="item-title">${escapeHtml(article.title || '无标题')}</div>
                            <div class="item-meta">
                                ${article.date || ''}
                                ${tagsHtml}
                                ${statusHtml}
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="btn-edit" data-idx="${realIdx}">编辑</button>
                            ${article.delete ?
                                '<button class="btn-restore" data-idx="' + realIdx + '">恢复</button>' :
                                '<button class="btn-delete" data-idx="' + realIdx + '">删除</button>'
                            }
                        </div>
                    </div>
                `;
            });

            list.innerHTML = html;

            // 事件绑定
            list.querySelectorAll('.btn-edit').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    editArticle(idx);
                });
            });

            list.querySelectorAll('.btn-delete').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    deleteArticle(idx);
                });
            });

            list.querySelectorAll('.btn-restore').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    restoreArticle(idx);
                });
            });
        }

        // ============================================================
        // 文章操作
        // ============================================================
        let editingIdx = -1;

        function editArticle(idx) {
            const article = allArticles[idx];
            if (!article) return;
            editingIdx = idx;
            document.getElementById('editTitle').value = article.title || '';
            document.getElementById('editTags').value = (article.tags || []).join('，');
            mdEditor.value = article.content || '';
            updatePreview();
            document.querySelector('.tab[data-tab="write"]').click();
            showToast('已加载文章，修改后点击发布即可更新');
        }
