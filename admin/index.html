        }
        .modal-box .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 0.5rem;
        }
        body.dark .modal-box .modal-title {
            color: #e8e6f0;
        }
        .modal-box .modal-desc {
            font-size: 0.9rem;
            color: #6a6a92;
            line-height: 1.7;
            margin-bottom: 1rem;
        }
        body.dark .modal-box .modal-desc {
            color: #a8a4c8;
        }
        .modal-box .modal-desc strong {
            color: #1a1a2e;
        }
        body.dark .modal-box .modal-desc strong {
            color: #e8e6f0;
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 0.8rem;
        }
        .modal-box .modal-actions button {
            flex: 1;
            padding: 0.7rem 1.2rem;
            border: none;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
        }
        .modal-box .modal-actions .btn-cancel {
            background: rgba(0, 0, 0, 0.06);
            color: #6a6a92;
        }
        body.dark .modal-box .modal-actions .btn-cancel {
            background: rgba(255, 255, 255, 0.08);
            color: #9a96b8;
        }
        .modal-box .modal-actions .btn-cancel:hover {
            background: rgba(0, 0, 0, 0.1);
        }
        body.dark .modal-box .modal-actions .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .modal-box .modal-actions .btn-confirm {
            background: #e53935;
            color: #fff;
        }
        .modal-box .modal-actions .btn-confirm:hover {
            transform: scale(1.02);
        }
        .modal-box .modal-actions .btn-confirm-primary {
            background: linear-gradient(145deg, #7a6bcf, #624ed0);
            color: #fff;
        }
        .modal-box .modal-actions .btn-confirm-primary:hover {
            transform: scale(1.02);
        }
        .modal-box .modal-actions .btn-confirm-warning {
            background: #f57c00;
            color: #fff;
        }
        .modal-box .modal-actions .btn-confirm-warning:hover {
            transform: scale(1.02);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(28, 26, 44, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 0.8rem 2.5rem;
            border-radius: 60px;
            color: #efeaff;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1000;
            pointer-events: none;
            white-space: nowrap;
        }
        body.dark .toast {
            background: rgba(20, 18, 30, 0.95);
            border-color: rgba(255, 255, 255, 0.05);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.error {
            background: rgba(200, 50, 50, 0.92);
        }
        body.dark .toast.error {
            background: rgba(180, 40, 40, 0.95);
        }

        @media (max-width: 600px) {
            .container { padding: 1.2rem 0.8rem; }
            .admin-header .title { font-size: 1.2rem; }
            .login-card { padding: 2rem 1.5rem; }
            .editor-panel { padding: 1rem; }
            .editor-split { height: 300px; flex-direction: column; }
            .editor-split .preview { border-left: none; border-top: 1px solid rgba(0, 0, 0, 0.06); min-height: 150px; }
            body.dark .editor-split .preview { border-top-color: rgba(255, 255, 255, 0.08); }
            .article-item-admin { flex-wrap: wrap; padding: 0.8rem 1rem; }
            .article-item-admin .item-actions { width: 100%; justify-content: flex-end; }
            .draft-item { flex-wrap: wrap; padding: 0.8rem 1rem; }
            .draft-item .draft-actions { width: 100%; justify-content: flex-end; }
            .tabs .tab { padding: 0.4rem 0.8rem; font-size: 0.75rem; }
            .toast { font-size: 0.8rem; padding: 0.6rem 1.5rem; white-space: normal; max-width: 90%; }
            .editor-actions button { padding: 0.6rem 1.2rem; font-size: 0.8rem; }
            .modal-box { padding: 1.6rem 1.2rem; }
            .modal-box .modal-actions { flex-direction: column; }
            .editor-row { flex-direction: column; }
            .admin-header .right-group { gap: 0.4rem; }
            .admin-header .theme-toggle { width: 36px; height: 36px; font-size: 1rem; }
            .admin-header .btn-logout { font-size: 0.75rem; padding: 0.3rem 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ========== 登录界面 ========== -->
        <div id="loginScreen">
            <div class="login-card">
                <h1>管理后台</h1>
                <p class="sub">ks · 内容管理</p>

                <div class="input-group">
                    <span class="input-icon"><i class="fas fa-key"></i></span>
                    <input type="password" id="inviteCode" placeholder="邀请码" autocomplete="off" />
                </div>

                <div class="input-group">
                    <span class="input-icon"><i class="fas fa-lock"></i></span>
                    <input type="password" id="passwordInput" placeholder="请输入密码" autocomplete="current-password" />
                </div>

                <div class="math-row">
                    <span class="math-question" id="mathQuestion">加载题目中...</span>
                    <input type="text" id="mathAnswer" placeholder="答案" autocomplete="off" />
                    <button type="button" class="refresh-btn" id="refreshMathBtn" aria-label="刷新题目">
                        <i class="fas fa-rotate-right"></i>
                    </button>
                </div>

                <div class="login-options">
                    <label>
                        <input type="checkbox" id="keepLogin" checked />
                        保持登录
                    </label>
                </div>

                <button class="btn-login" id="loginBtn">登录</button>
                <div class="error-msg" id="loginError"></div>
            </div>
        </div>

        <!-- ========== 主应用 ========== -->
        <div id="mainApp">
            <div class="admin-header">
                <span class="title">管理后台</span>
                <div class="right-group">
                    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                        <i class="fas fa-moon" id="themeIcon"></i>
                    </button>
                    <button class="btn-logout" id="logoutBtn">退出</button>
                </div>
            </div>

            <div class="tabs" id="tabs">
                <button class="tab active" data-tab="write">写文章</button>
                <button class="tab" data-tab="list">文章列表 <span class="badge" id="listBadge">0</span></button>
                <button class="tab" data-tab="drafts">草稿箱 <span class="badge" id="draftBadge">0</span></button>
            </div>

            <!-- ========== Tab: 写文章 ========== -->
            <div class="tab-content active" id="tabWrite">
                <div class="editor-section">
                    <div class="editor-panel">
                        <div class="panel-label">编辑</div>
                        <input type="text" id="editTitle" placeholder="文章标题" />
                        <div class="editor-row">
                            <input type="date" id="editDate" />
                            <input type="text" id="editTags" placeholder="标签，用逗号分隔" style="flex:2;" />
                        </div>

                        <!-- 自定义工具栏 -->
                        <div class="custom-toolbar" id="customToolbar">
                            <button data-cmd="bold" title="加粗"><b>B</b></button>
                            <button data-cmd="italic" title="斜体"><i>I</i></button>
                            <button data-cmd="strike" title="删除线"><s>S</s></button>
                            <span class="sep"></span>
                            <button data-cmd="h1">H1</button>
                            <button data-cmd="h2">H2</button>
                            <button data-cmd="h3">H3</button>
                            <span class="sep"></span>
                            <button data-cmd="ul" title="无序列表"><i class="fas fa-list-ul"></i></button>
                            <button data-cmd="ol" title="有序列表"><i class="fas fa-list-ol"></i></button>
                            <span class="sep"></span>
                            <button data-cmd="code" title="行内代码">&lt;/&gt;</button>
                            <button data-cmd="codeblock" title="代码块"><i class="fas fa-code"></i></button>
                            <span class="sep"></span>
                            <button data-cmd="quote" title="引用"><i class="fas fa-quote-left"></i></button>
                            <button data-cmd="link" title="链接"><i class="fas fa-link"></i></button>
                            <button data-cmd="image" title="图片"><i class="fas fa-image"></i></button>
                            <span class="sep"></span>
                            <button data-cmd="table" title="表格"><i class="fas fa-table"></i></button>
                            <button data-cmd="hr" title="分割线"><i class="fas fa-minus"></i></button>
                        </div>

                        <!-- 编辑器分屏 -->
                        <div class="editor-split" id="editorSplit">
                            <textarea id="mdEditor" placeholder="用 Markdown 写文章..."></textarea>
                            <div class="preview" id="previewArea">
                                <span style="color:#8a8ab5;font-size:0.85rem;">预览会显示在这里</span>
                            </div>
                        </div>

                        <div class="editor-footer">
                            <span>字数：<span class="word-count" id="wordCount">0</span></span>
                        </div>

                        <div class="editor-actions">
                            <button class="btn-publish" id="publishBtn">发布文章</button>
                            <button class="btn-save-draft" id="saveDraftBtn">存草稿</button>
                            <button class="btn-cancel" id="cancelEditBtn">清空</button>
                        </div>
                    </div>

                    <!-- 右侧：预览区（已合并到左侧分屏，保留占位） -->
                    <div class="editor-panel">
                        <div class="panel-label">预览</div>
                        <div style="min-height:400px; border-radius:12px; background:rgba(255,255,255,0.2); padding:20px; color:#8a8ab5; font-size:0.85rem;">
                            预览已合并到左侧分屏模式
                        </div>
                    </div>
                </div>
            </div>

            <!-- ========== Tab: 文章列表 ========== -->
            <div class="tab-content" id="tabList">
                <div class="list-controls">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="published">已发布</button>
                    <button class="filter-btn" data-filter="deleted">已删除</button>
                    <button class="sort-btn" id="sortBtn"><i class="fas fa-sort-amount-down"></i> 倒序</button>
                    <input class="search-input" id="listSearch" placeholder="搜索文章..." />
                    <span class="count-badge" id="listCount">0 篇</span>
                </div>
                <div class="article-list" id="articleList"></div>
            </div>

            <!-- ========== Tab: 草稿箱 ========== -->
            <div class="tab-content" id="tabDrafts">
                <div class="article-list" id="draftList"></div>
            </div>
        </div>
    </div>

    <!-- ========== 模态框 ========== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <span class="modal-icon" id="modalIcon"><i class="fas fa-exclamation-triangle"></i></span>
            <div class="modal-title" id="modalTitle">确认操作</div>
            <div class="modal-desc" id="modalDesc">确定要执行此操作吗？</div>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancel">取消</button>
                <button class="btn-confirm" id="modalConfirm">确认</button>
            </div>
        </div>
    </div>

    <!-- ========== Toast ========== -->
    <div class="toast" id="toast"></div>

    <!-- ========== 依赖（本地文件） ========== -->
    <script src="/libs/marked.min.js"></script>
    <script src="/libs/DOMPurify.min.js"></script>

    <script>
        // ================================================================
        // 以下所有代码完全保留原样，只有编辑器相关逻辑替换为本地依赖
        // ================================================================

        // ---------- 登录相关（完全保留） ----------
        var mathQuestionText = '';

        async function fetchMathQuestion() {
            try {
                var res = await fetch('/api/auth', {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });
                var data = await res.json();
                if (data.question) {
                    mathQuestionText = data.question;
                    document.getElementById('mathQuestion').textContent = data.question;
                    document.getElementById('mathAnswer').value = '';
                    document.getElementById('mathAnswer').focus();
                }
            } catch (e) {
                document.getElementById('mathQuestion').textContent = '加载题目失败，请刷新';
            }
        }

        var STORAGE_KEY = 'admin_logged_in';
        var KEEP_LOGIN_KEY = 'admin_keep_login';
        var TOKEN_KEY = 'admin_token';

        var themeToggle = document.getElementById('themeToggle');
        var themeIcon = document.getElementById('themeIcon');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var currentTheme = localStorage.getItem('ks-theme') || (prefersDark ? 'dark' : 'light');

        function setTheme(theme) {
            document.body.classList.toggle('dark', theme === 'dark');
            themeIcon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('ks-theme', theme);
            currentTheme = theme;
        }
        setTheme(currentTheme);
        themeToggle.addEventListener('click', function() {
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        var toastEl = document.getElementById('toast');
        var toastTimer = null;

        function showToast(msg, isError) {
            toastEl.textContent = msg;
            toastEl.className = 'toast';
            if (isError) toastEl.classList.add('error');
            clearTimeout(toastTimer);
            void toastEl.offsetWidth;
            toastEl.classList.add('show');
            toastTimer = setTimeout(function() {
                toastEl.classList.remove('show');
            }, 3000);
        }

        var modalOverlay = document.getElementById('modalOverlay');
        var modalIcon = document.getElementById('modalIcon');
        var modalTitle = document.getElementById('modalTitle');
        var modalDesc = document.getElementById('modalDesc');
        var modalConfirm = document.getElementById('modalConfirm');
        var modalCancel = document.getElementById('modalCancel');
        var modalResolve = null;

        function showModal(iconHtml, title, desc, confirmText, confirmClass) {
            return new Promise(function(resolve) {
                modalIcon.innerHTML = iconHtml || '<i class="fas fa-exclamation-triangle"></i>';
                modalTitle.textContent = title || '确认操作';
                modalDesc.innerHTML = desc || '确定要执行此操作吗？';
                modalConfirm.textContent = confirmText || '确认';
                modalConfirm.className = confirmClass || 'btn-confirm';
                modalResolve = resolve;
                modalOverlay.classList.add('active');
            });
        }

        function closeModal(result) {
            modalOverlay.classList.remove('active');
            if (modalResolve) {
                modalResolve(result);
                modalResolve = null;
            }
        }

        modalCancel.addEventListener('click', function() { closeModal(false); });
        modalConfirm.addEventListener('click', function() { closeModal(true); });
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === this) closeModal(false);
        });

        var loginScreen = document.getElementById('loginScreen');
        var mainApp = document.getElementById('mainApp');
        var passwordInput = document.getElementById('passwordInput');
        var loginBtn = document.getElementById('loginBtn');
        var loginError = document.getElementById('loginError');
        var keepLoginCheck = document.getElementById('keepLogin');
        var inviteCodeInput = document.getElementById('inviteCode');
        var mathAnswerInput = document.getElementById('mathAnswer');
        var refreshMathBtn = document.getElementById('refreshMathBtn');

        refreshMathBtn.addEventListener('click', function() {
            fetchMathQuestion();
            mathAnswerInput.focus();
        });

        mathAnswerInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doLogin();
        });

        if (localStorage.getItem(KEEP_LOGIN_KEY) === 'false') {
            keepLoginCheck.checked = false;
        } else {
            keepLoginCheck.checked = true;
        }

        var loginAttempts = 0;
        var lockUntil = 0;

        function resetLoginForm() {
            inviteCodeInput.value = '';
            passwordInput.value = '';
            mathAnswerInput.value = '';
            loginError.textContent = '';
            loginAttempts = 0;
            lockUntil = 0;
            fetchMathQuestion();
        }

        function getToken() {
            return localStorage.getItem(TOKEN_KEY) || '';
        }

        function clearToken() {
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(TOKEN_KEY);
        }

        function checkLogin() {
            var loggedIn = localStorage.getItem(STORAGE_KEY);
            var token = localStorage.getItem(TOKEN_KEY);
            var keepLogin = localStorage.getItem(KEEP_LOGIN_KEY) !== 'false';

            if (loggedIn === 'true' && token && keepLogin) {
                loginScreen.classList.add('hidden');
                mainApp.classList.add('active');
                loadAll();
                return true;
            }
            if (!keepLogin) {
                clearToken();
            }
            return false;
        }

        async function doLogin() {
            var inviteCode = inviteCodeInput.value.trim();
            var pwd = passwordInput.value.trim();
            var userAnswer = parseInt(mathAnswerInput.value.trim());

            if (!inviteCode) {
                loginError.textContent = '请输入邀请码';
                return;
            }
            if (!pwd) {
                loginError.textContent = '请输入密码';
                return;
            }
            if (isNaN(userAnswer)) {
                loginError.textContent = '请输入数学题答案';
                return;
            }

            if (Date.now() < lockUntil) {
                var remaining = Math.ceil((lockUntil - Date.now()) / 60000);
                loginError.textContent = '尝试次数过多，请 ' + remaining + ' 分钟后重试';
                return;
            }

            loginBtn.disabled = true;
            loginError.textContent = '';
            try {
                var res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: {
                        'X-Invite-Code': inviteCode,
                        'X-Admin-Password': pwd,
                        'X-Math-Answer': String(userAnswer),
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });
                var data = await res.json();

                if (data.error && data.error.includes('数学题')) {
                    loginError.textContent = data.error;
                    fetchMathQuestion();
                    loginBtn.disabled = false;
                    return;
                }

                if (data.success) {
                    loginAttempts = 0;
                    var keepLogin = keepLoginCheck.checked;
                    localStorage.setItem(KEEP_LOGIN_KEY, String(keepLogin));
                    localStorage.setItem(TOKEN_KEY, data.token);
                    localStorage.setItem(STORAGE_KEY, 'true');
                    loginScreen.classList.add('hidden');
                    mainApp.classList.add('active');
                    loadAll();
                } else {
                    loginAttempts++;
                    if (loginAttempts >= 5) {
                        lockUntil = Date.now() + 15 * 60 * 1000;
                        loginError.textContent = '尝试次数过多，请 15 分钟后重试';
                    } else {
                        loginError.textContent = '验证失败（' + loginAttempts + '/5）';
                    }
                    fetchMathQuestion();
                }
            } catch (e) {
                loginError.textContent = '网络错误，请重试';
            }
            loginBtn.disabled = false;
        }

        loginBtn.addEventListener('click', doLogin);
        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doLogin();
        });
        inviteCodeInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doLogin();
        });

        document.getElementById('logoutBtn').addEventListener('click', function() {
            clearToken();
            if (localStorage.getItem(KEEP_LOGIN_KEY) === 'false') {
                clearToken();
            }
            loginScreen.classList.remove('hidden');
            mainApp.classList.remove('active');
            resetLoginForm();
            passwordInput.value = '';
            loginError.textContent = '';
            // 清空编辑器
            if (editor) {
                editor.value = '';
                updatePreview();
                updateWordCount();
            }
        });

        // ---------- Tab 切换（完全保留） ----------
        var tabs = document.querySelectorAll('.tab');
        var tabContents = {
            write: document.getElementById('tabWrite'),
            list: document.getElementById('tabList'),
            drafts: document.getElementById('tabDrafts')
        };

        var isDeletingDraft = false;

        tabs.forEach(function(tab) {
            tab.addEventListener('click', function() {
                if (isDeletingDraft) {
                    showToast('正在删除草稿，请稍候', true);
                    return;
                }
                tabs.forEach(function(t) { t.classList.remove('active'); });
                this.classList.add('active');
                var target = this.dataset.tab;
                Object.keys(tabContents).forEach(function(key) {
                    tabContents[key].classList.toggle('active', key === target);
                });
                if (target === 'list') renderArticleList();
                if (target === 'drafts') renderDraftList();
            });
        });

        // ================================================================
        // 新的编辑器逻辑（基于 marked + DOMPurify，无 CDN）
        // ================================================================

        var editor = document.getElementById('mdEditor');
        var previewArea = document.getElementById('previewArea');
        var wordCountEl = document.getElementById('wordCount');
        var publishBtn = document.getElementById('publishBtn');
        var editDateInput = document.getElementById('editDate');

        // ---------- 设置默认日期 ----------
        function setDefaultDate() {
            if (!editDateInput.value) {
                var today = new Date().toISOString().slice(0, 10);
                editDateInput.value = today;
            }
        }
        setDefaultDate();

        // ---------- 字数统计 ----------
        function countWords(text) {
            if (!text) return 0;
            var clean = text
                .replace(/```[\s\S]*?```/g, '')
                .replace(/`[^`]+`/g, '')
                .replace(/\*\*(.*?)\*\*/g, '$1')
                .replace(/\*([^*]+)\*/g, '$1')
                .replace(/~~(.*?)~~/g, '$1')
                .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
                .replace(/!\[([^\]]*)\]\([^)]*\)/g, '')
                .replace(/^#{1,6}\s+/gm, '')
                .replace(/^-\s+/gm, '')
                .replace(/^\d+\.\s+/gm, '')
                .replace(/^>\s+/gm, '')
                .replace(/^---$/gm, '')
                .replace(/\s+/g, ' ')
                .trim();
            return clean.length;
        }

        function updateWordCount() {
            var text = editor ? editor.value : '';
            wordCountEl.textContent = countWords(text);
        }

        // ---------- 渲染预览 ----------
        function updatePreview() {
            try {
                var raw = editor.value || '';
                // 用 marked 解析
                var html = marked.parse(raw);
                // 用 DOMPurify 净化
                var clean = DOMPurify.sanitize(html);
                previewArea.innerHTML = clean || '<span style="color:#8a8ab5;font-size:0.85rem;">预览会显示在这里</span>';
            } catch (e) {
                console.error('渲染预览失败:', e);
                previewArea.innerHTML = '<span style="color:#e53935;font-size:0.85rem;">预览渲染失败，请检查 Markdown 语法</span>';
            }
        }

        // ---------- 编辑器输入事件 ----------
        if (editor) {
            editor.addEventListener('input', function() {
                updatePreview();
                updateWordCount();
            });
        }

        // ---------- 插入/包裹文本 ----------
        function insertText(text) {
            if (!editor) return;
            var start = editor.selectionStart;
            var end = editor.selectionEnd;
            var value = editor.value;
            if (typeof start !== 'number' || typeof end !== 'number') {
                start = 0;
                end = 0;
            }
            editor.value = value.substring(0, start) + text + value.substring(end);
            var pos = start + text.length;
            editor.selectionStart = editor.selectionEnd = pos;
            editor.focus();
            updatePreview();
            updateWordCount();
        }

        function wrapText(before, after) {
            if (!editor) return;
            var start = editor.selectionStart;
            var end = editor.selectionEnd;
            var value = editor.value;
            var selected = '';
            try {
                selected = value.substring(start, end) || '';
            } catch (e) {
                selected = '';
            }
            var newValue = value.substring(0, start) + before + selected + after + value.substring(end);
            editor.value = newValue;
            var pos = start + before.length;
            if (selected.length > 0) {
                editor.selectionStart = pos;
                editor.selectionEnd = pos + selected.length;
            } else {
                editor.selectionStart = editor.selectionEnd = pos;
            }
            editor.focus();
            updatePreview();
            updateWordCount();
        }

        // ---------- 插入列表标记 ----------
        function insertListMarker(marker) {
            if (!editor) return;
            var start = editor.selectionStart;
            var value = editor.value;
            var lines = value.split('\n');
            var lineIndex = 0;
            var charCount = 0;
            for (var i = 0; i < lines.length; i++) {
                charCount += lines[i].length + 1;
                if (start <= charCount) {
                    lineIndex = i;
                    break;
                }
            }
            if (lineIndex >= lines.length) return;

            var currentLine = lines[lineIndex];
            var indent = currentLine.match(/^(\s*)/)[1];

            if (/^(\s*)([-*+]|\d+\.)\s+/.test(currentLine)) {
                showToast('当前行已是列表', true);
                return;
            }

            var prefix = indent + marker;
            var before = value.substring(0, start - currentLine.length);
            var after = value.substring(start);
            editor.value = before + prefix + currentLine.trimStart() + after;
            var newPos = start + prefix.length;
            editor.selectionStart = editor.selectionEnd = newPos;
            editor.focus();
            updatePreview();
            updateWordCount();
        }

        // ---------- 回车续行 ----------
        function handleListEnter() {
            if (!editor) return false;
            var value = editor.value;
            var cursorPos = editor.selectionStart;
            var lines = value.split('\n');
            var lineIndex = 0;
            var charCount = 0;
            for (var i = 0; i < lines.length; i++) {
                charCount += lines[i].length + 1;
                if (cursorPos <= charCount) {
                    lineIndex = i;
                    break;
                }
            }
            if (lineIndex >= lines.length) return false;
            var currentLine = lines[lineIndex];

            // 空列表项 → 退出列表
            var emptyUl = currentLine.match(/^(\s*)([-*+])\s*$/);
            var emptyOl = currentLine.match(/^(\s*)(\d+)\.\s*$/);
            if (emptyUl || emptyOl) {
                var before = value.substring(0, cursorPos - currentLine.length);
                var after = value.substring(cursorPos);
                editor.value = before + after;
                var newPos = cursorPos - currentLine.length;
                editor.selectionStart = editor.selectionEnd = newPos;
                editor.focus();
                updatePreview();
                updateWordCount();
                return true;
            }

            // 续行：无序列表
            var ulMatch = currentLine.match(/^(\s*)([-*+])\s+/);
            if (ulMatch) {
                var indent = ulMatch[1];
                var marker = ulMatch[2];
                var prefix = indent + marker + ' ';
                var before = value.substring(0, cursorPos);
                var after = value.substring(cursorPos);
                editor.value = before + '\n' + prefix + after;
                var newPos = cursorPos + 1 + prefix.length;
                editor.selectionStart = editor.selectionEnd = newPos;
                editor.focus();
                updatePreview();
                updateWordCount();
                return true;
            }

            // 续行：有序列表
            var olMatch = currentLine.match(/^(\s*)(\d+)\.\s+/);
            if (olMatch) {
                var indent = olMatch[1];
                var num = parseInt(olMatch[2]) + 1;
                var prefix = indent + num + '. ';
                var before = value.substring(0, cursorPos);
                var after = value.substring(cursorPos);
                editor.value = before + '\n' + prefix + after;
                var newPos = cursorPos + 1 + prefix.length;
                editor.selectionStart = editor.selectionEnd = newPos;
                editor.focus();
                updatePreview();
                updateWordCount();
                return true;
            }

            return false;
        }

        // ---------- 键盘事件 ----------
        if (editor) {
            editor.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    var handled = handleListEnter();
                    if (handled) {
                        e.preventDefault();
                    }
                }
            });
        }

        // ---------- 工具栏按钮 ----------
        document.querySelectorAll('#customToolbar button[data-cmd]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                try {
                    var cmd = this.dataset.cmd;
                    var start = editor ? editor.selectionStart : 0;
                    var end = editor ? editor.selectionEnd : 0;
                    var selected = '';
                    try {
                        selected = editor.value.substring(start, end) || '';
                    } catch (e) {
                        selected = '';
                    }

                    switch (cmd) {
                        case 'bold':
                            wrapText('**', '**');
                            break;
                        case 'italic':
                            wrapText('*', '*');
                            break;
                        case 'strike':
                            wrapText('~~', '~~');
                            break;
                        case 'h1':
                            insertText('# ');
                            break;
                        case 'h2':
                            insertText('## ');
                            break;
                        case 'h3':
                            insertText('### ');
                            break;
                        case 'ul':
                            insertListMarker('- ');
                            break;
                        case 'ol':
                            insertListMarker('1. ');
                            break;
                        case 'code':
                            wrapText('`', '`');
                            break;
                        case 'codeblock':
                            insertText('\n```\n\n```\n');
                            var pos = editor.selectionStart;
                            editor.selectionStart = editor.selectionEnd = pos - 3;
                            editor.focus();
                            break;
                        case 'quote':
                            insertText('> ');
                            break;
                        case 'link':
                            if (selected) { wrapText('[', '](url)'); } else { insertText('[](url)'); }
                            break;
                        case 'image':
                            if (selected) { wrapText('![', '](图片url)'); } else { insertText('![](图片url)'); }
                            break;
                        case 'table':
                            insertText('\n| 列1 | 列2 | 列3 |\n|-----|-----|-----|\n| 内容 | 内容 | 内容 |\n');
                            break;
                        case 'hr':
                            insertText('\n---\n');
                            break;
                        default:
                            return;
                    }
                    updatePreview();
                    updateWordCount();
                } catch (e) {
                    console.error('工具栏操作出错:', e);
                    showToast('操作出错，请重试', true);
                }
            });
        });

        // ---------- 清空编辑器 ----------
        function clearEditor() {
            document.getElementById('editTitle').value = '';
            document.getElementById('editDate').value = '';
            document.getElementById('editTags').value = '';
            if (editor) {
                editor.value = '';
                updatePreview();
                updateWordCount();
            }
            editingIdx = -1;
            publishBtn.textContent = '发布文章';
            setDefaultDate();
        }

        // ---------- API 调用（完全保留） ----------
        async function apiCall(endpoint, options) {
            var token = getToken();
            var defaultOptions = {
                headers: {
                    'X-Admin-Token': token,
                    'Content-Type': 'application/json'
                }
            };
            var merged = {
                ...defaultOptions,
                ...options,
                headers: { ...defaultOptions.headers, ...(options?.headers || {}) }
            };
            var res = await fetch('/api/' + endpoint, merged);
            if (res.status === 401) {
                showToast('登录已过期，请重新登录', true);
                clearToken();
                loginScreen.classList.remove('hidden');
                mainApp.classList.remove('active');
                throw new Error('Unauthorized');
            }
            if (res.status === 403) {
                showToast('请求来源不合法，请从 admin.cuizi.top 访问', true);
                throw new Error('Forbidden');
            }
            return res;
        }

        // ---------- 数据（完全保留） ----------
        var allArticles = [];
        var currentFilter = 'all';
        var currentSort = 'desc';
        var allDrafts = [];
        var editingIdx = -1;
        var previousVersion = null;
        var hardDeleteTarget = -1;
        var EXPIRE_TIME = 48 * 60 * 60 * 1000;

        // ---------- 加载数据（完全保留） ----------
        async function loadAll() {
            await loadArticles();
            renderArticleList();
            await loadDrafts();
            renderDraftList();
            updateBadges();
        }

        async function loadArticles() {
            try {
                var res = await apiCall('posts', { method: 'GET' });
                var data = await res.json();
                allArticles = data.announcements || [];
            } catch (e) {
                showToast('加载文章失败', true);
                allArticles = [];
            }
        }

        async function loadDrafts() {
            try {
                var res = await apiCall('drafts', { method: 'GET' });
                var data = await res.json();
                allDrafts = data.drafts || [];
            } catch (e) {
                allDrafts = [];
            }
        }

        // ---------- 工具函数（完全保留） ----------
        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function getFilteredArticles(filter) {
            var result = allArticles.slice();
            if (filter === 'published') {
                result = result.filter(function(a) { return !a.delete; });
            } else if (filter === 'deleted') {
                result = result.filter(function(a) { return a.delete; });
            }
            if (currentSort === 'desc') {
                result.sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });
            } else {
                result.sort(function(a, b) { return (a.date || '').localeCompare(b.date || ''); });
            }
            return result;
        }

        // ---------- 渲染文章列表（完全保留） ----------
        function renderArticleList() {
            var list = document.getElementById('articleList');
            var search = document.getElementById('listSearch').value.trim().toLowerCase();
            var filtered = getFilteredArticles(currentFilter);
            if (search) {
                filtered = filtered.filter(function(a) {
                    var title = (a.title || '').toLowerCase();
                    var content = (a.content || '').toLowerCase();
                    return title.indexOf(search) !== -1 || content.indexOf(search) !== -1;
                });
            }
            document.getElementById('listCount').textContent = filtered.length + ' 篇';
            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty">没有文章</div>';
                return;
            }
            var html = '';
            filtered.forEach(function(article) {
                var idx = allArticles.indexOf(article);
                var tags = article.tags || [];
                var tagsHtml = tags.map(function(t) {
                    return '<span class="tag">' + escapeHtml(t) + '</span>';
                }).join(' ');
                var deletedClass = article.delete ? 'deleted' : '';
                var statusHtml = article.delete ? '<span class="status-deleted">已删除</span>' : '';

                var undoBtn = '';
                if (previousVersion && previousVersion.idx === idx) {
                    var elapsed = Date.now() - previousVersion.savedAt;
                    if (elapsed < EXPIRE_TIME) {
                        var remainHours = Math.ceil((EXPIRE_TIME - elapsed) / (60 * 60 * 1000));
                        undoBtn = '<button class="btn-undo" data-idx="' + idx + '" title="还剩 ' + remainHours + ' 小时可撤销">撤销</button>';
                    } else {
                        previousVersion = null;
                    }
                }

                html += '<div class="article-item-admin ' + deletedClass + '">' +
                    '<div class="item-info">' +
                    '<div class="item-title">' + escapeHtml(article.title || '无标题') + '</div>' +
                    '<div class="item-meta">' +
                    (article.date || '') +
                    tagsHtml +
                    statusHtml +
                    '</div>' +
                    '</div>' +
                    '<div class="item-actions">' +
                    '<button class="btn-edit" data-idx="' + idx + '">编辑</button>' +
                    (article.delete ?
                        '<button class="btn-restore" data-idx="' + idx + '">恢复</button>' :
                        '<button class="btn-soft-delete" data-idx="' + idx + '">软删除</button>') +
                    '<button class="btn-hard-delete" data-idx="' + idx + '" data-title="' + escapeHtml(article.title || '无标题') + '">硬删除</button>' +
                    undoBtn +
                    '</div>' +
                    '</div>';
            });
            list.innerHTML = html;

            list.querySelectorAll('.btn-edit').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var idx = parseInt(this.dataset.idx);
                    editArticle(idx);
                });
            });
            list.querySelectorAll('.btn-soft-delete').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var idx = parseInt(this.dataset.idx);
                    softDeleteArticle(idx);
                });
            });
            list.querySelectorAll('.btn-restore').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var idx = parseInt(this.dataset.idx);
                    restoreArticle(idx);
                });
            });
            list.querySelectorAll('.btn-hard-delete').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var idx = parseInt(this.dataset.idx);
                    var title = this.dataset.title;
                    showHardDeleteModal(idx, title);
                });
            });
            list.querySelectorAll('.btn-undo').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var idx = parseInt(this.dataset.idx);
                    undoArticle(idx);
                });
            });
        }

        // ---------- 文章操作（完全保留，只修改了编辑器取值/赋值） ----------
        function editArticle(idx) {
            var article = allArticles[idx];
            if (!article) return;
            editingIdx = idx;
            document.getElementById('editTitle').value = article.title || '';
            document.getElementById('editDate').value = article.date || '';
            document.getElementById('editTags').value = (article.tags || []).join('，');
            if (editor) {
                editor.value = article.content || '';
                updatePreview();
                updateWordCount();
            }
            publishBtn.textContent = '更新文章';
            document.querySelector('.tab[data-tab="write"]').click();
            showToast('已加载文章，修改后点更新');
        }

        async function softDeleteArticle(idx) {
            var result = await showModal(
                '<i class="fas fa-trash-alt"></i>',
                '软删除',
                '确定要软删除这篇文章吗？<br />软删除后文章仍可恢复。',
                '确认软删除',
                'btn-confirm-warning'
            );
            if (!result) return;
            try {
                var res = await apiCall('posts', {
                    method: 'DELETE',
                    body: JSON.stringify({ id: idx })
                });
                var data = await res.json();
                if (data.success) {
                    showToast('已软删除');
                    await loadArticles();
                    renderArticleList();
                    updateBadges();
                } else {
                    showToast(data.error || '删除失败', true);
                }
            } catch (e) {
                showToast('删除失败', true);
            }
        }

        async function restoreArticle(idx) {
            try {
                var res = await apiCall('posts', {
                    method: 'DELETE',
                    body: JSON.stringify({ id: idx, restore: true })
                });
                var data = await res.json();
                if (data.success) {
                    showToast('已恢复');
                    await loadArticles();
                    renderArticleList();
                    updateBadges();
                } else {
                    showToast(data.error || '恢复失败', true);
                }
            } catch (e) {
                showToast('恢复失败', true);
            }
        }

        async function undoArticle(idx) {
            if (!previousVersion || previousVersion.idx !== idx) {
                showToast('没有可撤销的版本', true);
                return;
            }
            var elapsed = Date.now() - previousVersion.savedAt;
            if (elapsed >= EXPIRE_TIME) {
                showToast('撤销已过期（超过48小时）', true);
                previousVersion = null;
                renderArticleList();
                return;
            }
            var result = await showModal(
                '<i class="fas fa-undo-alt"></i>',
                '撤销修改',
                '确定要撤销对 <strong>' + escapeHtml(previousVersion.title) + '</strong> 的修改吗？<br />将恢复到修改前的版本。',
                '确认撤销',
                'btn-confirm-warning'
            );
            if (!result) return;
            try {
                var res = await apiCall('posts', {
                    method: 'PUT',
                    body: JSON.stringify({
                        id: idx,
                        title: previousVersion.title,
                        content: previousVersion.content,
                        tags: previousVersion.tags,
                        date: previousVersion.date
                    })
                });
                var data = await res.json();
                if (data.success) {
                    showToast('已撤销');
                    previousVersion = null;
                    await loadArticles();
                    renderArticleList();
                    updateBadges();
                } else {
                    showToast(data.error || '撤销失败', true);
                }
            } catch (e) {
                showToast('撤销失败', true);
            }
        }

        function showHardDeleteModal(idx, title) {
            hardDeleteTarget = idx;
            var descHtml = '你正在执行<strong>硬删除</strong>操作，该文章将从数据中<strong>彻底移除</strong>，无法恢复。<br /><br />输入文章标题 <strong style="color:#e53935;">' + escapeHtml(title) + '</strong> 确认删除：<br /><br /><input type="text" id="hardDeleteConfirmInput" placeholder="输入文章标题..." style="width:100%;padding:0.6rem 1rem;border-radius:60px;border:2px solid #e53935;font-size:0.9rem;font-family:inherit;background:rgba(255,255,255,0.5);color:#1a1a2e;text-align:center;outline:none;" />';
            showModal(
                '<i class="fas fa-exclamation-triangle"></i>',
                '危险操作',
                descHtml,
                '确认硬删除',
                'btn-confirm'
            ).then(async function(confirmed) {
                if (confirmed) {
                    var confirmInput = document.getElementById('hardDeleteConfirmInput');
                    if (confirmInput && confirmInput.value.trim() === title) {
                        await confirmHardDelete();
                    } else {
                        showToast('标题输入不正确，取消删除', true);
                    }
                }
                hardDeleteTarget = -1;
            });
        }

        async function confirmHardDelete() {
            if (hardDeleteTarget === -1) return;
            try {
                var idx = hardDeleteTarget;
                allArticles.splice(idx, 1);
                var res = await apiCall('posts', {
                    method: 'PUT',
                    body: JSON.stringify({
                        hardDelete: true,
                        articles: allArticles
                    })
                });
                var data = await res.json();
                if (data.success) {
                    showToast('已硬删除');
                    await loadArticles();
                    renderArticleList();
                    updateBadges();
                } else {
                    showToast(data.error || '硬删除失败', true);
                    await loadArticles();
                    renderArticleList();
                }
            } catch (e) {
                showToast('硬删除失败', true);
                await loadArticles();
                renderArticleList();
            }
        }

        // ---------- 草稿（完全保留，只修改了编辑器取值/赋值） ----------
        function renderDraftList() {
            var list = document.getElementById('draftList');
            if (allDrafts.length === 0) {
                list.innerHTML = '<div class="empty">没有草稿</div>';
                return;
            }
            var html = '';
            allDrafts.forEach(function(draft) {
                var preview = (draft.content || '').replace(/\n/g, ' ').slice(0, 80) + (draft.content && draft.content.length > 80 ? '...' : '');
                var tagsHtml = (draft.tags || []).map(function(t) {
                    return '<span class="tag">' + escapeHtml(t) + '</span>';
                }).join(' ');
                html += '<div class="draft-item">' +
                    '<div class="draft-info">' +
                    '<div class="draft-title">' + escapeHtml(draft.title || '无标题') + '</div>' +
                    '<div class="draft-meta">创建于 ' + (draft.created || '') + (draft.updated && draft.updated !== draft.created ? ' · 更新于 ' + draft.updated : '') + '</div>' +
                    (tagsHtml ? '<div class="draft-tags">' + tagsHtml + '</div>' : '') +
                    '<div class="draft-preview">' + escapeHtml(preview) + '</div>' +
                    '</div>' +
                    '<div class="draft-actions">' +
                    '<button class="btn-continue" data-id="' + draft.id + '">继续编辑</button>' +
                    '<button class="btn-publish-draft" data-id="' + draft.id + '">发布</button>' +
                    '<button class="btn-delete-draft" data-id="' + draft.id + '">删除</button>' +
                    '</div>' +
                    '</div>';
            });
            list.innerHTML = html;

            list.querySelectorAll('.btn-continue').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var id = this.dataset.id;
                    var draft = allDrafts.find(function(d) { return d.id === id; });
                    if (draft) {
                        document.getElementById('editTitle').value = draft.title || '';
                        document.getElementById('editDate').value = draft.date || '';
                        document.getElementById('editTags').value = (draft.tags || []).join('，');
                        if (editor) {
                            editor.value = draft.content || '';
                            updatePreview();
                            updateWordCount();
                        }
                        editingIdx = -1;
                        publishBtn.textContent = '发布文章';
                        document.querySelector('.tab[data-tab="write"]').click();
                        showToast('已加载草稿');
                    }
                });
            });

            list.querySelectorAll('.btn-publish-draft').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var id = this.dataset.id;
                    var draft = allDrafts.find(function(d) { return d.id === id; });
                    if (draft) {
                        document.getElementById('editTitle').value = draft.title || '';
                        document.getElementById('editDate').value = draft.date || '';
                        document.getElementById('editTags').value = (draft.tags || []).join('，');
                        if (editor) {
                            editor.value = draft.content || '';
                            updatePreview();
                            updateWordCount();
                        }
                        editingIdx = -1;
                        publishBtn.textContent = '发布文章';
                        deleteDraft(id);
                        document.querySelector('.tab[data-tab="write"]').click();
                        document.getElementById('publishBtn').click();
                    }
                });
            });

            list.querySelectorAll('.btn-delete-draft').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var id = this.dataset.id;
                    if (isDeletingDraft) return;
                    showModal(
                        '<i class="fas fa-trash-alt"></i>',
                        '删除草稿',
                        '确定要删除这个草稿吗？',
                        '确认删除',
                        'btn-confirm'
                    ).then(async function(confirmed) {
                        if (confirmed) {
                            isDeletingDraft = true;
                            await deleteDraft(id);
                            isDeletingDraft = false;
                        }
                    });
                });
            });
        }

        async function deleteDraft(id) {
            try {
                var res = await apiCall('drafts', {
                    method: 'DELETE',
                    body: JSON.stringify({ id: id })
                });
                var data = await res.json();
                if (data.success) {
                    showToast('草稿已删除');
                    await loadDrafts();
                    renderDraftList();
                    updateBadges();
                } else {
                    showToast(data.error || '删除失败', true);
                }
            } catch (e) {
                showToast('删除失败', true);
            }
        }

        // ---------- 发布/更新（完全保留，只修改了编辑器取值） ----------
        document.getElementById('publishBtn').addEventListener('click', async function() {
            var title = document.getElementById('editTitle').value.trim();
            var content = editor ? editor.value.trim() : '';
            var tagsRaw = document.getElementById('editTags').value.trim();
            var date = document.getElementById('editDate').value;
            var tags = tagsRaw ? tagsRaw.split(/[，,、\s]+/).filter(Boolean) : [];

            if (!title) {
                showToast('请输入标题', true);
                return;
            }
            if (!content) {
                showToast('请输入内容', true);
                return;
            }

            if (editingIdx >= 0) {
                var existing = allArticles.findIndex(function(a, i) {
                    return i !== editingIdx && a.title === title;
                });
                if (existing !== -1) {
                    var confirmed = await showModal(
                        '<i class="fas fa-exclamation-triangle"></i>',
                        '标题重复',
                        '已存在标题为 <strong>' + escapeHtml(title) + '</strong> 的文章。<br />确定要覆盖它吗？',
                        '确认覆盖',
                        'btn-confirm-warning'
                    );
                    if (!confirmed) return;
                }

                var current = allArticles[editingIdx];
                previousVersion = {
                    idx: editingIdx,
                    title: current.title,
                    content: current.content,
                    tags: current.tags,
                    date: current.date,
                    savedAt: Date.now()
                };
            }

            this.disabled = true;
            try {
                var res, data;
                if (editingIdx >= 0) {
                    res = await apiCall('posts', {
                        method: 'PUT',
                        body: JSON.stringify({
                            id: editingIdx,
                            title: title,
                            content: content,
                            tags: tags,
                            date: date || undefined
                        })
                    });
                    data = await res.json();
                    if (data.success) {
                        showToast('文章已更新');
                        editingIdx = -1;
                        publishBtn.textContent = '发布文章';
                        clearEditor();
                        await loadArticles();
                        renderArticleList();
                        updateBadges();
                    } else {
                        showToast(data.error || '更新失败', true);
                    }
                } else {
                    res = await apiCall('posts', {
                        method: 'POST',
                        body: JSON.stringify({
                            title: title,
                            content: content,
                            tags: tags,
                            date: date || undefined
                        })
                    });
                    data = await res.json();
                    if (data.success) {
                        showToast('发布成功！');
                        clearEditor();
                        await loadArticles();
                        renderArticleList();
                        updateBadges();
                    } else {
                        showToast(data.error || '发布失败', true);
                    }
                }
            } catch (e) {
                showToast('请求失败', true);
            }
            this.disabled = false;
        });

        // ---------- 清空按钮（完全保留） ----------
        document.getElementById('cancelEditBtn').addEventListener('click', function() {
            if (editingIdx >= 0 || (editor && editor.value) || document.getElementById('editTitle').value) {
                showModal(
                    '<i class="fas fa-trash-alt"></i>',
                    '清空内容',
                    '确定要清空当前编辑的内容吗？<br />未保存的修改将丢失。',
                    '确认清空',
                    'btn-confirm-warning'
                ).then(function(confirmed) {
                    if (confirmed) {
                        clearEditor();
                        showToast('已清空');
                    }
                });
            }
        });

        // ---------- 保存草稿（完全保留，只修改了编辑器取值） ----------
        document.getElementById('saveDraftBtn').addEventListener('click', async function() {
            var title = document.getElementById('editTitle').value.trim() || '无标题';
            var content = editor ? editor.value : '';
            var tagsRaw = document.getElementById('editTags').value.trim();
            var tags = tagsRaw ? tagsRaw.split(/[，,、\s]+/).filter(Boolean) : [];
            var date = document.getElementById('editDate').value || '';
            if (!content) {
                showToast('内容为空，无需保存', true);
                return;
            }
            this.disabled = true;
            try {
                var res = await apiCall('drafts', {
                    method: 'POST',
                    body: JSON.stringify({ title, content, tags, date })
                });
                var data = await res.json();
                if (data.success) {
                    showToast('草稿已保存');
                    await loadDrafts();
                    renderDraftList();
                    updateBadges();
                } else {
                    showToast(data.error || '保存失败', true);
                }
            } catch (e) {
                showToast('保存失败', true);
            }
            this.disabled = false;
        });

        // ---------- 列表筛选/排序/搜索（完全保留） ----------
        document.querySelectorAll('#tabList .filter-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#tabList .filter-btn').forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderArticleList();
            });
        });

        document.getElementById('sortBtn').addEventListener('click', function() {
            var btn = this;
            if (currentSort === 'desc') {
                currentSort = 'asc';
                btn.innerHTML = '<i class="fas fa-sort-amount-up"></i> 正序';
            } else {
                currentSort = 'desc';
                btn.innerHTML = '<i class="fas fa-sort-amount-down"></i> 倒序';
            }
            renderArticleList();
        });

        document.getElementById('listSearch').addEventListener('input', function() {
            renderArticleList();
        });

        // ---------- 更新角标（完全保留） ----------
        function updateBadges() {
            document.getElementById('listBadge').textContent = allArticles.length;
            document.getElementById('draftBadge').textContent = allDrafts.length;
        }

        // ---------- 初始化 ----------
        fetchMathQuestion();

        // 初始化预览
        if (editor) {
            updatePreview();
            updateWordCount();
        }

        if (!checkLogin()) {
            loginScreen.classList.remove('hidden');
            mainApp.classList.remove('active');
        }

        // 延迟更新字数
        setTimeout(function() {
            updateWordCount();
        }, 500);

        // 页面关闭前清理
        window.addEventListener('beforeunload', function() {
            if (localStorage.getItem(KEEP_LOGIN_KEY) === 'false') {
                clearToken();
            }
        });
    </script>
</body>
</html>
