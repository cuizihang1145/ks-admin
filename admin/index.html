<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>管理后台 · ks</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            outline: none !important;
        }
        *:focus,
        *:active,
        *:visited {
            outline: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }
        a:focus,
        a:active,
        button:focus,
        button:active,
        input:focus,
        input:active,
        textarea:focus,
        textarea:active {
            outline: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }
        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f5f3ff;
            color: #1a1a2e;
            min-height: 100vh;
            transition: background 0.4s ease, color 0.3s ease;
        }
        body.dark {
            background: #12101e;
            color: #e8e6f0;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        #loginScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        #loginScreen.hidden {
            display: none;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2.8rem 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            width: 100%;
            max-width: 380px;
            text-align: center;
            transition: background 0.4s ease, border-color 0.3s ease;
            box-shadow: 0 20px 60px rgba(80, 60, 160, 0.08);
        }
        body.dark .login-card {
            background: rgba(30, 28, 50, 0.6);
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }
        .login-card h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #201D3A, #5B4DAF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.1rem;
        }
        body.dark .login-card h1 {
            background: linear-gradient(135deg, #c8c0f0, #8f7be0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-card .sub {
            color: #8a8ab5;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }
        body.dark .login-card .sub {
            color: #9a96b8;
        }
        .login-card .input-group {
            position: relative;
            margin-bottom: 0.6rem;
        }
        .login-card .input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            padding-left: 2.6rem;
            border-radius: 60px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.5);
            font-size: 0.95rem;
            color: #1a1a2e;
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
        }
        body.dark .login-card .input-group input {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: #e8e6f0;
        }
        .login-card .input-group input:focus {
            border-color: #6b5acf;
            box-shadow: 0 0 0 3px rgba(107, 90, 207, 0.12);
        }
        .login-card .input-group input::placeholder {
            color: #aaaac0;
        }
        body.dark .login-card .input-group input::placeholder {
            color: #6a6a8a;
        }
        .login-card .input-group .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #8a8ab5;
            font-size: 0.9rem;
            pointer-events: none;
        }
        body.dark .login-card .input-group .input-icon {
            color: #6a6a8a;
        }
        .login-card .math-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            margin-bottom: 0.6rem;
        }
        .login-card .math-row .math-question {
            font-size: 0.82rem;
            font-weight: 600;
            color: #6b5acf;
            white-space: nowrap;
            flex-shrink: 0;
            background: rgba(107, 90, 207, 0.08);
            padding: 0.4rem 0.7rem;
            border-radius: 40px;
        }
        body.dark .login-card .math-row .math-question {
            color: #88ccff;
            background: rgba(136, 204, 255, 0.08);
        }
        .login-card .math-row input {
            flex: 1;
            min-width: 60px;
            max-width: 130px;
            margin-bottom: 0;
            padding: 0.65rem 0.8rem;
            border-radius: 60px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            color: #1a1a2e;
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
        }
        body.dark .login-card .math-row input {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: #e8e6f0;
        }
        .login-card .math-row input:focus {
            border-color: #6b5acf;
            box-shadow: 0 0 0 3px rgba(107, 90, 207, 0.12);
        }
        .login-card .math-row .refresh-btn {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: #6a6a92;
            cursor: pointer;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        body.dark .login-card .math-row .refresh-btn {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: #9a96b8;
        }
        .login-card .math-row .refresh-btn:hover {
            background: rgba(107, 90, 207, 0.12);
            color: #6b5acf;
        }
        body.dark .login-card .math-row .refresh-btn:hover {
            background: rgba(136, 204, 255, 0.12);
            color: #88ccff;
        }
        .login-card .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: #8a8ab5;
        }
        body.dark .login-card .login-options {
            color: #7a7aa0;
        }
        .login-card .login-options label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            user-select: none;
        }
        .login-card .login-options input[type="checkbox"] {
            accent-color: #6b5acf;
            cursor: pointer;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        .login-card .btn-login {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 60px;
            background: linear-gradient(145deg, #7a6bcf, #624ed0);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 8px 24px rgba(90, 70, 170, 0.25);
        }
        body.dark .login-card .btn-login {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .login-card .btn-login:hover {
            transform: translateY(-2px);
        }
        .login-card .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .login-card .error-msg {
            color: #e57373;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            min-height: 1.5rem;
        }

        #mainApp {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        #mainApp.active {
            display: block;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideDown {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .admin-header .title {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #201D3A, #5B4DAF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        body.dark .admin-header .title {
            background: linear-gradient(135deg, #c8c0f0, #8f7be0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .admin-header .right-group {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .admin-header .theme-toggle {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #6a6a92;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        body.dark .admin-header .theme-toggle {
            background: rgba(40, 38, 65, 0.4);
            color: #9a96b8;
            border-color: rgba(255, 255, 255, 0.06);
        }
        .admin-header .theme-toggle:hover {
            transform: scale(1.05) rotate(8deg);
            background: rgba(255, 255, 255, 0.7);
        }
        body.dark .admin-header .theme-toggle:hover {
            background: rgba(60, 55, 100, 0.6);
        }
        .admin-header .btn-logout {
            padding: 0.4rem 1.2rem;
            border: none;
            border-radius: 60px;
            background: rgba(0, 0, 0, 0.06);
            color: #6a6a92;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s ease;
        }
        body.dark .admin-header .btn-logout {
            background: rgba(255, 255, 255, 0.08);
            color: #9a96b8;
        }
        .admin-header .btn-logout:hover {
            background: rgba(0, 0, 0, 0.1);
        }
        body.dark .admin-header .btn-logout:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .tabs {
            display: flex;
            gap: 0.3rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 1.5rem;
            overflow-x: auto;
        }
        body.dark .tabs {
            background: rgba(40, 38, 65, 0.3);
            border-color: rgba(255, 255, 255, 0.06);
        }
        .tabs .tab {
            padding: 0.6rem 1.4rem;
            border: none;
            border-radius: 60px;
            background: transparent;
            font-size: 0.85rem;
            font-weight: 500;
            color: #6a6a92;
            cursor: pointer;
            transition: 0.25s ease;
            white-space: nowrap;
        }
        body.dark .tabs .tab {
            color: #9a96b8;
        }
        .tabs .tab:hover {
            color: #3d2d8a;
        }
        body.dark .tabs .tab:hover {
            color: #c8c0f0;
        }
        .tabs .tab.active {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #3d2d8a;
            box-shadow: 0 4px 16px rgba(80, 60, 160, 0.08);
        }
        body.dark .tabs .tab.active {
            background: rgba(60, 55, 100, 0.55);
            color: #c8c0f0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        .tabs .tab .badge {
            display: inline-block;
            background: rgba(107, 90, 207, 0.15);
            color: #6b5acf;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.05rem 0.5rem;
            border-radius: 40px;
            margin-left: 0.3rem;
        }
        body.dark .tabs .tab .badge {
            background: rgba(136, 204, 255, 0.12);
            color: #88ccff;
        }
        .tab-content {
            display: none;
            animation: slideDown 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }

        .editor-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }
        @media (max-width: 768px) {
            .editor-section {
                grid-template-columns: 1fr;
            }
        }
        .editor-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: background 0.4s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        body.dark .editor-panel {
            background: rgba(40, 38, 65, 0.3);
            border-color: rgba(255, 255, 255, 0.05);
        }
        .editor-panel .panel-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #8a8ab5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.6rem;
        }
        body.dark .editor-panel .panel-label {
            color: #7a7aa0;
        }
        .editor-panel input {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.5);
            font-size: 0.95rem;
            color: #1a1a2e;
            margin-bottom: 0.8rem;
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
        }
        body.dark .editor-panel input {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: #e8e6f0;
        }
        .editor-panel input:focus {
            border-color: #6b5acf;
            box-shadow: 0 0 0 3px rgba(107, 90, 207, 0.1);
        }
        .editor-row {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }
        .editor-row input {
            flex: 1;
            margin-bottom: 0;
        }

        .md-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem;
            padding: 0.3rem;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 8px;
            margin-bottom: 0.4rem;
            transition: background 0.3s ease;
        }
        body.dark .md-toolbar {
            background: rgba(255, 255, 255, 0.04);
        }
        .md-toolbar button {
            min-width: 32px;
            height: 32px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: #6a6a92;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.15s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            -webkit-tap-highlight-color: transparent !important;
        }
        body.dark .md-toolbar button {
            color: #9a96b8;
        }
        .md-toolbar button:hover {
            background: rgba(107, 90, 207, 0.12);
            color: #6b5acf;
        }
        body.dark .md-toolbar button:hover {
            background: rgba(136, 204, 255, 0.12);
            color: #88ccff;
        }
        .md-toolbar .sep {
            width: 1px;
            background: rgba(0, 0, 0, 0.08);
            margin: 0 0.2rem;
        }
        body.dark .md-toolbar .sep {
            background: rgba(255, 255, 255, 0.08);
        }

        .md-editor {
            width: 100%;
            min-height: 400px;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
            color: #1a1a2e;
            resize: vertical;
            line-height: 1.7;
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
        }
        body.dark .md-editor {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: #e8e6f0;
        }
        .md-editor:focus {
            border-color: #6b5acf;
            box-shadow: 0 0 0 3px rgba(107, 90, 207, 0.1);
        }

        .editor-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.4rem;
            font-size: 0.75rem;
            color: #8a8ab5;
            gap: 1rem;
        }
        body.dark .editor-footer {
            color: #7a7aa0;
        }
        .editor-footer .word-count {
            font-weight: 500;
            color: #6b5acf;
        }
        body.dark .editor-footer .word-count {
            color: #88ccff;
        }

        .preview-area {
            min-height: 400px;
            max-height: 550px;
            overflow-y: auto;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
            line-height: 1.8;
            color: #2d2d4a;
            white-space: pre-wrap;
            word-wrap: break-word;
            transition: background 0.4s ease, border-color 0.3s ease, color 0.3s ease;
        }
        body.dark .preview-area {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.05);
            color: #d0caf0;
        }
        .preview-area h1,
        .preview-area h2,
        .preview-area h3,
        .preview-area h4,
        .preview-area h5,
        .preview-area h6 {
            margin: 0.6rem 0 0.3rem 0;
            font-weight: 700;
            color: #1a1a2e;
        }
        body.dark .preview-area h1,
        body.dark .preview-area h2,
        body.dark .preview-area h3,
        body.dark .preview-area h4,
        body.dark .preview-area h5,
        body.dark .preview-area h6 {
            color: #e8e6f0;
        }
        .preview-area p {
            margin-bottom: 0.5rem;
        }
        .preview-area code {
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            background: rgba(0, 0, 0, 0.06);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
        }
        body.dark .preview-area code {
            background: rgba(255, 255, 255, 0.06);
        }

        /* ===== 代码块样式（横竖都限制） ===== */
        .preview-area .code-block-wrapper {
            background: #0D1117 !important;
            border-radius: 12px;
            margin: 0.8rem 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-height: 460px;
            display: flex;
            flex-direction: column;
        }
        .preview-area .code-block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.04) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
            flex-shrink: 0;
            min-height: 40px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .preview-area .code-block-header .lang-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #8B949E !important;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-family: 'Inter', sans-serif;
        }
        .preview-area .code-block-header .code-stats {
            font-size: 0.65rem;
            color: #484F58 !important;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            flex: 1;
            text-align: center;
        }
        .preview-area .code-block-header .code-stats span {
            margin: 0 2px;
        }
        .preview-area .code-block-body-wrapper {
            overflow: hidden;
            flex: 1;
            min-height: 0;
        }
        .preview-area .code-block-body {
            display: block;
            overflow: auto;
            max-height: 400px;
            min-height: 60px;
            overflow-x: auto;
            overflow-y: auto;
            background: #0D1117 !important;
            padding: 0.4rem 0;
            font-size: 0;
            line-height: 0;
        }
        .preview-area .code-block-body .code-line {
            display: flex;
            font-size: 0.85rem;
            line-height: 1.7;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            color: #E6EDF3;
            white-space: pre;
            min-height: 1.7em;
            padding: 0 1.2rem;
            min-width: max-content;
        }
        .preview-area .code-block-body .code-line .line-number {
            flex-shrink: 0;
            width: 3.2rem;
            text-align: right;
            color: #484F58 !important;
            user-select: none;
            padding-right: 0.8rem;
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.85rem;
            line-height: 1.7;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            margin-right: 1.2rem;
        }
        .preview-area .code-block-body .code-line .hljs {
            background: transparent !important;
            padding: 0 !important;
            font-size: 0.85rem;
            line-height: 1.7;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            flex: 1;
            white-space: pre;
        }

        .preview-area blockquote {
            border-left: 3px solid #6b5acf;
            padding-left: 0.8rem;
            margin: 0.4rem 0;
            color: #6a6a92;
            font-style: italic;
        }
        body.dark .preview-area blockquote {

                            <button data-cmd="italic" title="斜体"><i>I</i></button>

                            <button data-cmd="codeblock"><i class="fas fa-code"></i></button>

                        <textarea class="md-editor" id="mdEditor" placeholder="用 Markdown 写文章..."></textarea>
                        <div class="editor-footer">
                            <span>字数：<span class="word-count" id="wordCount">0</span></span>
                        </div>
                        <div class="editor-actions">
                            <button class="btn-publish" id="publishBtn">发布文章</button>
                            <button class="btn-save-draft" id="saveDraftBtn">存草稿</button>
                            <button class="btn-cancel" id="cancelEditBtn">清空</button>

                    </div>
                    <div class="editor-panel">
                        <div class="panel-label">预览</div>
                        <div class="preview-area" id="previewArea">
                            <span style="color:#8a8ab5;font-size:0.85rem;">预览会显示在这里</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="tabList">
                <div class="list-controls">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="published">已发布</button>
                    <button class="filter-btn" data-filter="deleted">已删除</button>
                    <button class="sort-btn" id="sortBtn"><i class="fas fa-sort-amount-down"></i> 倒序</button>
                    <input class="search-input" id="listSearch" placeholder="搜索文章..." />
                    <span class="count-badge" id="listCount">0 篇</span>

            <div class="tab-content" id="tabDrafts">
