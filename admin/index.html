<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理后台 · ks</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f5f3ff;
            color: #1a1a2e;
            min-height: 100vh;
            transition: background 0.3s;
        }
        body.dark {
            background: #12101e;
            color: #e8e6f0;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }
        #loginScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        #loginScreen.hidden {
            display: none;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2.8rem 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        body.dark .login-card {
            background: rgba(30, 28, 50, 0.6);
            border-color: rgba(255, 255, 255, 0.08);
        }
        .login-card h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #201D3A, #5B4DAF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        body.dark .login-card h1 {
            background: linear-gradient(135deg, #c8c0f0, #8f7be0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-card .sub {
            color: #8a8ab5;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }
        .login-card input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border-radius: 60px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
            margin-bottom: 1rem;
            color: #1a1a2e;
        }
        body.dark .login-card input {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: #e8e6f0;
        }
        .login-card input:focus {
            outline: none;
            border-color: #6b5acf;
            box-shadow: 0 0 0 3px rgba(107, 90, 207, 0.15);
        }
        .login-card .btn-login {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 60px;
            background: linear-gradient(145deg, #7a6bcf, #624ed0);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }
        .login-card .btn-login:hover {
            transform: translateY(-2px);
        }
        .login-card .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .login-card .error-msg {
            color: #e57373;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            min-height: 1.5rem;
        }
        #mainApp {
            display: none;
        }
        #mainApp.active {
            display: block;
        }
        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .admin-header .title {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #201D3A, #5B4DAF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        body.dark .admin-header .title {
            background: linear-gradient(135deg, #c8c0f0, #8f7be0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .admin-header .btn-logout {
            padding: 0.4rem 1.2rem;
            border: none;
            border-radius: 60px;
            background: rgba(0, 0, 0, 0.06);
            color: #6a6a92;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        body.dark .admin-header .btn-logout {
            background: rgba(255, 255, 255, 0.08);
            color: #9a96b8;
        }

            background: rgba(0, 0, 0, 0.1);
        }
        body.dark .admin-header .btn-logout:hover {
            background: rgba(255, 255, 255, 0.15);
        }

            display: flex;
            gap: 0.3rem;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 1.5rem;
            overflow-x: auto;
        }
        body.dark .tabs {
            background: rgba(40, 38, 65, 0.3);
            border-color: rgba(255, 255, 255, 0.06);
        }
        .tabs .tab {
            padding: 0.6rem 1.4rem;
            border: none;
            border-radius: 60px;
            background: transparent;
            font-size: 0.85rem;
            font-weight: 500;
            color: #6a6a92;
            cursor: pointer;
            transition: 0.25s;
            white-space: nowrap;
        }
        body.dark .tabs .tab {
            color: #9a96b8;
        }
        .tabs .tab:hover {
            color: #3d2d8a;
        }
        body.dark .tabs .tab:hover {
            color: #c8c0f0;
        }
        .tabs .tab.active {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            color: #3d2d8a;

        body.dark .tabs .tab.active {
            background: rgba(60, 55, 100, 0.55);
            color: #c8c0f0;
        }
        .tabs .tab .badge {
            display: inline-block;
            background: rgba(107, 90, 207, 0.15);
            color: #6b5acf;

            font-weight: 600;
            padding: 0.05rem 0.5rem;
            border-radius: 40px;
            margin-left: 0.3rem;
        }
        body.dark .tabs .tab .badge {
            background: rgba(136, 204, 255, 0.12);
            color: #88ccff;
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .editor-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }
        @media (max-width: 768px) {
            .editor-section {
                grid-template-columns: 1fr;
            }
        }
        .editor-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.3);

        body.dark .editor-panel {
            background: rgba(40, 38, 65, 0.3);
            border-color: rgba(255, 255, 255, 0.05);

            font-weight: 600;

            margin-bottom: 0.6rem;

        .editor-panel input {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.5);
            font-size: 0.95rem;
            color: #1a1a2e;
            margin-bottom: 0.8rem;
        }
        body.dark .editor-panel input {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: #e8e6f0;
        }
        .editor-panel input:focus {
            outline: none;
            border-color: #6b5acf;
        }
        .md-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem;
            padding: 0.3rem;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 8px;
            margin-bottom: 0.4rem;
        }
        body.dark .md-toolbar {
            background: rgba(255, 255, 255, 0.04);
        }
        .md-toolbar button {
            min-width: 32px;
            height: 32px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: #6a6a92;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.15s;
            font-family: inherit;

            justify-content: center;

        body.dark .md-toolbar button:hover {

            width: 100%;
            min-height: 400px;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.06);

            border-color: #6b5acf;
        }

            overflow-y: auto;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;

            color: #2d2d4a;

        .preview-area h1,
        .preview-area h2,

        .preview-area h6 {
            margin: 0.6rem 0 0.3rem 0;
            font-weight: 700;
            color: #1a1a2e;
        }
        body.dark .preview-area h1,
        body.dark .preview-area h2,
        body.dark .preview-area h3,
        body.dark .preview-area h4,
        body.dark .preview-area h5,
        body.dark .preview-area h6 {
            color: #e8e6f0;
        }
        .preview-area p {
            margin-bottom: 0.5rem;
        }
        .preview-area code {
            font-family: 'Courier New', monospace;
            font-size: 0.85em;

            padding: 0.1rem 0.4rem;
            border-radius: 4px;
        }
        body.dark .preview-area code {
            background: rgba(255, 255, 255, 0.06);
        }
        .preview-area pre {
            background: #0d1117;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            overflow: auto;
            margin: 0.5rem 0;
        }
        .preview-area pre code {
            background: transparent;
            padding: 0;
            color: #e6edf3;
        }
        .preview-area blockquote {
            border-left: 3px solid #6b5acf;
            padding-left: 1rem;
            margin: 0.5rem 0;
            color: #6a6a92;
            font-style: italic;
        }
        body.dark .preview-area blockquote {
            border-left-color: #88ccff;
            color: #a8a4c8;
        }
        .preview-area img {
            max-width: 100%;
            border-radius: 8px;
            margin: 0.5rem 0;
        }
        .preview-area ul,
        .preview-area ol {
            padding-left: 1.5rem;
            margin: 0.4rem 0;
        }
        .preview-area ul li,
        .preview-area ol li {
            margin-bottom: 0.2rem;
        }
        .preview-area table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin: 0.5rem 0;
        }
        .preview-area th,
        .preview-area td {
            border: 1px solid rgba(0, 0, 0, 0.08);
            padding: 0.3rem 0.6rem;
            text-align: left;
        }
        body.dark .preview-area th,
        body.dark .preview-area td {
            border-color: rgba(255, 255, 255, 0.06);
        }
        .preview-area th {
            background: rgba(0, 0, 0, 0.04);
            font-weight: 600;
        }
        body.dark .preview-area th {
            background: rgba(255, 255, 255, 0.04);
        }
        .preview-area hr {
            border: none;
            border-top: 2px solid rgba(0, 0, 0, 0.08);
            margin: 1rem 0;
        }
        body.dark .preview-area hr {
            border-top-color: rgba(255, 255, 255, 0.08);
        }

            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .editor-actions button {
            padding: 0.7rem 1.8rem;
            border: none;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }
        .editor-actions .btn-publish {
            background: linear-gradient(145deg, #7a6bcf, #624ed0);
            color: #fff;
        }
        .editor-actions .btn-publish:hover {
            transform: translateY(-2px);
        }
        .editor-actions .btn-publish:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .editor-actions .btn-save-draft {
            background: rgba(0, 0, 0, 0.06);
            color: #6a6a92;
        }
        body.dark .editor-actions .btn-save-draft {
            background: rgba(255, 255, 255, 0.08);
            color: #9a96b8;
        }
        .editor-actions .btn-save-draft:hover {
            background: rgba(0, 0, 0, 0.1);
        }
        body.dark .editor-actions .btn-save-draft:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .editor-actions .btn-cancel {
            background: transparent;
            color: #8a8ab5;
        }
        .editor-actions .btn-cancel:hover {
            color: #4a4a6e;
        }
        body.dark .editor-actions .btn-cancel:hover {
            color: #d0caf0;
        }
        .list-controls {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            align-items: center;
        }
        .list-controls .filter-btn {
            padding: 0.3rem 1rem;
            border: none;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.3);
            color: #6a6a92;
            transition: 0.2s;
        }
        body.dark .list-controls .filter-btn {
            background: rgba(40, 38, 65, 0.3);
            color: #9a96b8;
        }

        }

            cursor: pointer;
            background: rgba(255, 255, 255, 0.3);
            color: #6a6a92;
            transition: 0.2s;
        }
        body.dark .list-controls .sort-btn {
            background: rgba(40, 38, 65, 0.3);
            color: #9a96b8;
        }
        .list-controls .sort-btn.active {

            color: #fff;
        }
        body.dark .list-controls .sort-btn.active {

        }
        .list-controls .count-badge {

            color: #8a8ab5;
            margin-left: auto;
        }
        body.dark .list-controls .count-badge {
            color: #7a7aa0;
        }
        .article-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

            border-radius: 1rem;

<body>
    <div class="container">
        <!-- 登录界面 -->
        <div id="loginScreen">
            <div class="login-card">
                <h1>管理后台</h1>
                <p class="sub">ks · 内容管理</p>

                <button class="btn-login" id="loginBtn">登录</button>

            </div>
        </div>

        <!-- 主应用 -->
        <div id="mainApp">
            <div class="admin-header">
                <span class="title">管理后台</span>

            </div>

            <div class="tabs" id="tabs">

            <div class="tab-content active" id="tabWrite">

                            <button data-cmd="italic" title="斜体"><i>I</i></button>
                            <button data-cmd="strike" title="删除线"><s>S</s></button>
                            <span class="sep"></span>
                            <button data-cmd="h1">H1</button>
                            <button data-cmd="h2">H2</button>
                            <button data-cmd="h3">H3</button>
                            <button data-cmd="h4">H4</button>
                            <button data-cmd="h5">H5</button>
                            <button data-cmd="h6">H6</button>
                            <span class="sep"></span>
                            <button data-cmd="link"><i class="fas fa-link"></i></button>
                            <button data-cmd="image"><i class="fas fa-image"></i></button>
                            <span class="sep"></span>
                            <button data-cmd="code">&lt;/&gt;</button>
                            <button data-cmd="codeblock"><i class="fas fa-code"></i></button>
                            <span class="sep"></span>
                            <button data-cmd="quote"><i class="fas fa-quote-left"></i></button>
                            <button data-cmd="ul"><i class="fas fa-list-ul"></i></button>
                            <button data-cmd="ol"><i class="fas fa-list-ol"></i></button>
                            <span class="sep"></span>

                        <textarea class="md-editor" id="mdEditor" placeholder="用 Markdown 写文章..."></textarea>
                        <div class="editor-actions">
                            <button class="btn-publish" id="publishBtn">发布文章</button>
                            <button class="btn-save-draft" id="saveDraftBtn">存草稿</button>
                            <button class="btn-cancel" id="cancelEditBtn">清空</button>
                        </div>
                    </div>
                    <div class="editor-panel">
                        <div class="panel-label">预览</div>
                        <div class="preview-area" id="previewArea">
                            <span style="color:#8a8ab5;font-size:0.85rem;">预览会显示在这里</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 文章列表 -->
            <div class="tab-content" id="tabList">
                <div class="list-controls">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="published">已发布</button>
                    <button class="filter-btn" data-filter="deleted">已删除</button>
                    <button class="sort-btn" id="sortBtn"><i class="fas fa-sort-amount-down"></i> 倒序</button>
                    <input class="search-input" id="listSearch" placeholder="搜索文章..." />
                    <span class="count-badge" id="listCount">0 篇</span>
                </div>
                <div class="article-list" id="articleList"></div>

    </div>

    <!-- 硬删除确认弹窗 -->
    <div class="hard-delete-overlay" id="hardDeleteOverlay">
        <div class="hard-delete-box">
            <div class="icon"><i class="fas fa-exclamation-triangle"></i></div>
            <div class="title">危险操作</div>
            <div class="warning">此操作不可恢复！</div>
            <div class="desc">你正在执行<strong>硬删除</strong>操作，该文章将从 <code>wenzhang.json</code> 中<strong>彻底移除</strong>，无法通过任何方式恢复。</div>
            <div class="article-title" id="hardDeleteTitle">文章标题</div>
            <div class="desc" style="font-size:0.8rem;color:#E53935;font-weight:500;">输入 <strong style="color:#E53935;">删除</strong> 确认</div>
            <input type="text" id="hardDeleteConfirm" placeholder="输入「删除」" style="width:100%;padding:0.6rem 1rem;border-radius:60px;border:2px solid #E53935;font-size:0.9rem;font-family:inherit;background:rgba(255,255,255,0.5);color:#1a1a2e;margin-bottom:1rem;text-align:center;" />
            <div class="actions">
                <button class="btn-cancel" id="hardDeleteCancel">取消</button>
                <button class="btn-confirm-hard" id="hardDeleteConfirmBtn" disabled>确认硬删除</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ===== 配置 =====
        const PASSWORD = 'QwQ20141031.';

        // ===== 主题 =====
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        let currentTheme = localStorage.getItem('ks-theme') || (prefersDark ? 'dark' : 'light');

        function setTheme(theme) {
            document.body.classList.toggle('dark', theme === 'dark');
            localStorage.setItem('ks-theme', theme);
            currentTheme = theme;
        }
        setTheme(currentTheme);

        // ===== Toast =====
        const toastEl = document.getElementById('toast');
        let toastTimer = null;

        function showToast(msg, isError) {
            toastEl.textContent = msg;
            toastEl.className = 'toast';
            if (isError) toastEl.classList.add('error');
            clearTimeout(toastTimer);
            void toastEl.offsetWidth;
            toastEl.classList.add('show');
            toastTimer = setTimeout(function() {
                toastEl.classList.remove('show');
            }, 3000);
        }

        // ===== 登录 =====
        const loginScreen = document.getElementById('loginScreen');
        const mainApp = document.getElementById('mainApp');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        function checkLogin() {
            if (sessionStorage.getItem('admin_logged_in') === 'true') {
                loginScreen.classList.add('hidden');
                mainApp.classList.add('active');
                loadAll();
                return true;
            }
            return false;
        }

        async function doLogin() {
            const pwd = passwordInput.value.trim();
            if (!pwd) {
                loginError.textContent = '请输入密码';
                return;
            }
            loginBtn.disabled = true;
            loginError.textContent = '';
            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'X-Admin-Password': pwd, 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const data = await res.json();
                if (data.success) {
                    sessionStorage.setItem('admin_logged_in', 'true');
                    sessionStorage.setItem('admin_password', pwd);
                    loginScreen.classList.add('hidden');
                    mainApp.classList.add('active');
                    loadAll();
                } else {
                    loginError.textContent = '密码错误';
                }
            } catch (e) {
                loginError.textContent = '网络错误，请重试';
            }
            loginBtn.disabled = false;
        }
        loginBtn.addEventListener('click', doLogin);
        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doLogin();
        });

        document.getElementById('logoutBtn').addEventListener('click', function() {
            sessionStorage.removeItem('admin_logged_in');
            sessionStorage.removeItem('admin_password');
            loginScreen.classList.remove('hidden');
            mainApp.classList.remove('active');
            passwordInput.value = '';
            loginError.textContent = '';
        });

        // ===== Tab 切换 =====
        const tabs = document.querySelectorAll('.tab');
        const tabContents = {
            write: document.getElementById('tabWrite'),
            list: document.getElementById('tabList'),
            drafts: document.getElementById('tabDrafts')
        };
        tabs.forEach(function(tab) {
            tab.addEventListener('click', function() {
                tabs.forEach(function(t) { t.classList.remove('active'); });
                this.classList.add('active');
                const target = this.dataset.tab;
                Object.keys(tabContents).forEach(function(key) {
                    tabContents[key].classList.toggle('active', key === target);
                });
                if (target === 'list') renderArticleList();
                if (target === 'drafts') renderDraftList();
            });
        });

        // ===== Markdown 编辑器 =====
        const mdEditor = document.getElementById('mdEditor');
        const previewArea = document.getElementById('previewArea');

        // 插入文本（保留光标位置）
        function insertText(text) {
            const start = mdEditor.selectionStart;
            const end = mdEditor.selectionEnd;
            const value = mdEditor.value;
            mdEditor.value = value.substring(0, start) + text + value.substring(end);
            const pos = start + text.length;
            mdEditor.selectionStart = mdEditor.selectionEnd = pos;
            mdEditor.focus();
            updatePreview();
        }

        // 包裹选中文本
        function wrapText(before, after) {
            const start = mdEditor.selectionStart;
            const end = mdEditor.selectionEnd;
            const value = mdEditor.value;
            const selected = value.substring(start, end);
            mdEditor.value = value.substring(0, start) + before + selected + after + value.substring(end);
            const pos = start + before.length;
            mdEditor.selectionStart = mdEditor.selectionEnd = (selected.length === 0) ? pos : pos + selected.length;
            mdEditor.focus();
            updatePreview();
        }

        // 列表自动延续
        function handleListContinuation() {
            const value = mdEditor.value;
            const cursorPos = mdEditor.selectionStart;
            const lines = value.split('\n');
            let lineIndex = 0;
            let charCount = 0;
            for (let i = 0; i < lines.length; i++) {
                charCount += lines[i].length + 1;
                if (cursorPos <= charCount) {
                    lineIndex = i;
                    break;
                }
            }
            if (lineIndex > lines.length - 1) return false;
            const currentLine = lines[lineIndex] || '';
            // 有序列表匹配：数字. 空格
            const olMatch = currentLine.match(/^(\s*)(\d+)\.\s+/);
            if (olMatch) {
                const indent = olMatch[1];
                const num = parseInt(olMatch[2]) + 1;
                const prefix = indent + num + '. ';
                // 检查下一行是否已经有内容
                const nextLine = lines[lineIndex + 1] || '';
                if (nextLine.trim() === '') {
                    // 插入新行并自动补全
                    const before = value.substring(0, cursorPos);
                    const after = value.substring(cursorPos);
                    mdEditor.value = before + '\n' + prefix + after;
                    const newPos = cursorPos + 1 + prefix.length;
                    mdEditor.selectionStart = mdEditor.selectionEnd = newPos;
                    mdEditor.focus();
                    updatePreview();
                    return true;
                }
                return false;
            }
            // 无序列表匹配：- 或 * 空格
            const ulMatch = currentLine.match(/^(\s*)([-*])\s+/);
            if (ulMatch) {
                const indent = ulMatch[1];
                const marker = ulMatch[2];
                const prefix = indent + marker + ' ';
                const nextLine = lines[lineIndex + 1] || '';
                if (nextLine.trim() === '') {
                    const before = value.substring(0, cursorPos);
                    const after = value.substring(cursorPos);
                    mdEditor.value = before + '\n' + prefix + after;
                    const newPos = cursorPos + 1 + prefix.length;
                    mdEditor.selectionStart = mdEditor.selectionEnd = newPos;
                    mdEditor.focus();
                    updatePreview();
                    return true;
                }
                return false;
            }
            return false;
        }

        // 工具栏按钮
        document.querySelectorAll('#mdToolbar button[data-cmd]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const cmd = this.dataset.cmd;
                const start = mdEditor.selectionStart;
                const end = mdEditor.selectionEnd;
                const selected = mdEditor.value.substring(start, end);

                switch (cmd) {
                    case 'bold':
                        wrapText('**', '**');
                        break;
                    case 'italic':
                        wrapText('*', '*');
                        break;
                    case 'strike':
                        wrapText('~~', '~~');
                        break;
                    case 'h1':
                        insertText('# ');
                        break;
                    case 'h2':
                        insertText('## ');
                        break;
                    case 'h3':
                        insertText('### ');
                        break;
                    case 'h4':
                        insertText('#### ');
                        break;
                    case 'h5':
                        insertText('##### ');
                        break;
                    case 'h6':
                        insertText('###### ');
                        break;
                    case 'link':
                        if (selected) {
                            wrapText('[', '](url)');
                        } else {
                            insertText('[](url)');
                        }
                        break;
                    case 'image':
                        if (selected) {
                            wrapText('![', '](图片url)');
                        } else {
                            insertText('![](图片url)');
                        }
                        break;
                    case 'code':
                        wrapText('`', '`');
                        break;
                    case 'codeblock':
                        insertText('\n```\n\n```\n');
                        // 将光标定位到两个换行之间
                        const pos = mdEditor.selectionStart;
                        mdEditor.selectionStart = mdEditor.selectionEnd = pos - 3;
                        mdEditor.focus();
                        break;
                    case 'quote':
                        insertText('> ');
                        break;
                    case 'ul':
                        insertText('- ');
                        break;
                    case 'ol':
                        insertText('1. ');
                        break;
                    case 'table':
                        insertText('\n| 列1 | 列2 | 列3 |\n|-----|-----|-----|\n| 内容 | 内容 | 内容 |\n');
                        break;
                    case 'hr':
                        insertText('\n---\n');
                        break;
                    default:
                        return;
                }
                updatePreview();
            });
        });

        // 键盘事件：监听 Enter 键自动延续列表
        mdEditor.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const handled = handleListContinuation();
                if (handled) {
                    e.preventDefault();
                }
            }
        });

        // 预览更新
        function updatePreview() {
            previewArea.innerHTML = renderMarkdown(mdEditor.value);
        }
        mdEditor.addEventListener('input', updatePreview);

        // ===== Markdown 渲染 =====
        function renderMarkdown(md) {
            if (!md) return '<span style="color:#8a8ab5;font-size:0.85rem;">预览会显示在这里</span>';

            let html = md;

            // 转义 HTML 特殊字符（防止 XSS）
            html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            // 代码块（必须放最前面，防止内部被解析）
            html = html.replace(/```([\s\S]*?)```/g, function(match, code) {
                return '<pre><code>' + code + '</code></pre>';
            });

            // 行内代码
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // 粗体
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            // 斜体
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');

            // 删除线
            html = html.replace(/~~(.*?)~~/g, '<del>$1</del>');

            // 标题
            html = html.replace(/^###### (.*$)/gm, '<h6>$1</h6>');
            html = html.replace(/^##### (.*$)/gm, '<h5>$1</h5>');
            html = html.replace(/^#### (.*$)/gm, '<h4>$1</h4>');
            html = html.replace(/^### (.*$)/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gm, '<h1>$1</h1>');

            // 引用
            html = html.replace(/^> (.*$)/gm, '<blockquote>$1</blockquote>');

            // 链接
            html = html.replace(/\[([^\]]*)\]\(([^)]*)\)/g, '<a href="$2" target="_blank">$1</a>');

            // 图片
            html = html.replace(/!\[([^\]]*)\]\(([^)]*)\)/g, '<img src="$2" alt="$1" />');

            // 无序列表：将连续的 - 或 * 行转为 ul
            html = html.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
            // 将连续的 li 包裹成 ul
            html = html.replace(/(<li>.*<\/li>\s*)+/g, function(match) {
                return '<ul>' + match.trim() + '</ul>';
            });

            // 有序列表：将连续的数字. 行转为 ol
            html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>\s*)+/g, function(match) {
                // 检查是否已经被 ul 包裹了
                if (match.indexOf('<ul>') !== -1) return match;
                return '<ol>' + match.trim() + '</ol>';
            });

            // 分割线
            html = html.replace(/^---$/gm, '<hr />');

            // 换行转为 <br />（但不破坏已有的块级元素）
            html = html.replace(/\n/g, '<br />');

            return html;
        }

        // ===== API =====
        function getPassword() {
            return sessionStorage.getItem('admin_password') || PASSWORD;
        }

        async function apiCall(endpoint, options) {
            const defaultOptions = {
                headers: {
                    'X-Admin-Password': getPassword(),
                    'Content-Type': 'application/json'
                }
            };
            const merged = {
                ...defaultOptions,
                ...options,
                headers: { ...defaultOptions.headers, ...(options?.headers || {}) }
            };
            const res = await fetch('/api/' + endpoint, merged);
            if (res.status === 401) {
                showToast('登录已过期，请重新登录', true);
                sessionStorage.removeItem('admin_logged_in');
                loginScreen.classList.remove('hidden');
                mainApp.classList.remove('active');
                throw new Error('Unauthorized');
            }
            return res;
        }

        // ===== 文章数据 =====
        let allArticles = [];
        let currentFilter = 'all';
        let currentSort = 'desc';
        let allDrafts = [];
        let editingIdx = -1;

        async function loadAll() {
            await loadArticles();
            renderArticleList();
            await loadDrafts();
            renderDraftList();
            updateBadges();
        }

        async function loadArticles() {
            try {
                const res = await apiCall('posts', { method: 'GET' });
                const data = await res.json();
                allArticles = data.announcements || [];
            } catch (e) {
                showToast('加载文章失败', true);
                allArticles = [];
            }
        }

        async function loadDrafts() {
            try {
                const res = await apiCall('drafts', { method: 'GET' });
                const data = await res.json();
                allDrafts = data.drafts || [];
            } catch (e) {
                allDrafts = [];
            }
        }

        function getFilteredArticles(filter) {
            let result = allArticles.slice();
            if (filter === 'published') {
                result = result.filter(function(a) { return !a.delete; });
            } else if (filter === 'deleted') {
                result = result.filter(function(a) { return a.delete; });
            }
            if (currentSort === 'desc') {
                result.sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });
            } else {
                result.sort(function(a, b) { return (a.date || '').localeCompare(b.date || ''); });
            }
            return result;
        }

        function renderArticleList() {
            const list = document.getElementById('articleList');
            const search = document.getElementById('listSearch').value.trim().toLowerCase();
            let filtered = getFilteredArticles(currentFilter);
            if (search) {
                filtered = filtered.filter(function(a) {
                    const title = (a.title || '').toLowerCase();
                    const content = (a.content || '').toLowerCase();
                    return title.indexOf(search) !== -1 || content.indexOf(search) !== -1;
                });
            }
            document.getElementById('listCount').textContent = filtered.length + ' 篇';
            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty">没有文章</div>';
                return;
            }
            let html = '';
            filtered.forEach(function(article) {
                const idx = allArticles.indexOf(article);
                const tags = article.tags || [];
                const tagsHtml = tags.map(function(t) {
                    return '<span class="tag">' + escapeHtml(t) + '</span>';
                }).join(' ');
                const deletedClass = article.delete ? 'deleted' : '';
                const statusHtml = article.delete ? '<span class="status-deleted">已删除</span>' : '';
                html += `
                    <div class="article-item-admin ${deletedClass}">
                        <div class="item-info">
                            <div class="item-title">${escapeHtml(article.title || '无标题')}</div>
                            <div class="item-meta">
                                ${article.date || ''}
                                ${tagsHtml}
                                ${statusHtml}
                            </div>
                        </div>
                        <div class="item-actions">
                            <button class="btn-edit" data-idx="${idx}">编辑</button>
                            ${article.delete ?
                                '<button class="btn-restore" data-idx="' + idx + '">恢复</button>' :
                                '<button class="btn-soft-delete" data-idx="' + idx + '">软删除</button>'
                            }
                            <button class="btn-hard-delete" data-idx="${idx}" data-title="${escapeHtml(article.title || '无标题')}">硬删除</button>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
            list.querySelectorAll('.btn-edit').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    editArticle(idx);
                });
            });
            list.querySelectorAll('.btn-soft-delete').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    softDeleteArticle(idx);
                });
            });
            list.querySelectorAll('.btn-restore').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    restoreArticle(idx);
                });
            });
            list.querySelectorAll('.btn-hard-delete').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    const title = this.dataset.title;
                    showHardDeleteModal(idx, title);
                });
            });
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function editArticle(idx) {
            const article = allArticles[idx];
            if (!article) return;
            editingIdx = idx;
            document.getElementById('editTitle').value = article.title || '';
            document.getElementById('editTags').value = (article.tags || []).join('，');
            mdEditor.value = article.content || '';
            updatePreview();
            document.querySelector('.tab[data-tab="write"]').click();
            showToast('已加载文章，修改后点发布更新');
        }

        async function softDeleteArticle(idx) {
            if (!confirm('确定要软删除这篇文章吗？')) return;
            try {
                const res = await apiCall('posts', {
                    method: 'DELETE',
                    body: JSON.stringify({ id: idx })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('已软删除');
                    await loadArticles();
                    renderArticleList();
                    updateBadges();
                } else {
                    showToast(data.error || '删除失败', true);
                }
            } catch (e) {
                showToast('删除失败', true);
            }
        }

        async function restoreArticle(idx) {
            try {
                const res = await apiCall('posts', {
                    method: 'DELETE',
                    body: JSON.stringify({ id: idx, restore: true })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('已恢复');
                    await loadArticles();
                    renderArticleList();
                    updateBadges();
                } else {
                    showToast(data.error || '恢复失败', true);
                }
            } catch (e) {
                showToast('恢复失败', true);
            }
        }

        // ===== 硬删除 =====
        let hardDeleteTarget = -1;
        const hardDeleteOverlay = document.getElementById('hardDeleteOverlay');
        const hardDeleteTitle = document.getElementById('hardDeleteTitle');
        const hardDeleteConfirm = document.getElementById('hardDeleteConfirm');
        const hardDeleteConfirmBtn = document.getElementById('hardDeleteConfirmBtn');
        const hardDeleteCancel = document.getElementById('hardDeleteCancel');

        function showHardDeleteModal(idx, title) {
            hardDeleteTarget = idx;
            hardDeleteTitle.textContent = title;
            hardDeleteConfirm.value = '';
            hardDeleteConfirmBtn.disabled = true;
            hardDeleteOverlay.classList.add('active');
            hardDeleteConfirm.focus();
        }

        hardDeleteConfirm.addEventListener('input', function() {
            hardDeleteConfirmBtn.disabled = this.value !== '删除';
        });
        hardDeleteConfirm.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !hardDeleteConfirmBtn.disabled) confirmHardDelete();
            if (e.key === 'Escape') closeHardDeleteModal();
        });
        hardDeleteCancel.addEventListener('click', closeHardDeleteModal);
        hardDeleteConfirmBtn.addEventListener('click', confirmHardDelete);
        hardDeleteOverlay.addEventListener('click', function(e) {
            if (e.target === this) closeHardDeleteModal();
        });

        function closeHardDeleteModal() {
            hardDeleteOverlay.classList.remove('active');
            hardDeleteTarget = -1;
            hardDeleteConfirm.value = '';
            hardDeleteConfirmBtn.disabled = true;
        }

        async function confirmHardDelete() {
            if (hardDeleteTarget === -1) return;
            try {
                const res = await apiCall('posts', {
                    method: 'DELETE',
                    body: JSON.stringify({ id: hardDeleteTarget, hard: true })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('已硬删除');
                    closeHardDeleteModal();
                    await loadArticles();
                    renderArticleList();
                    updateBadges();
                } else {
                    showToast(data.error || '硬删除失败', true);
                }
            } catch (e) {
                showToast('硬删除失败', true);
            }
        }

        // ===== 草稿 =====
        function renderDraftList() {
            const list = document.getElementById('draftList');
            if (allDrafts.length === 0) {
                list.innerHTML = '<div class="empty">没有草稿</div>';
                return;
            }
            let html = '';
            allDrafts.forEach(function(draft) {
                const preview = (draft.content || '').replace(/\n/g, ' ').slice(0, 80) + (draft.content && draft.content
                    .length > 80 ? '...' : '');
                html += `
                    <div class="draft-item">
                        <div class="draft-info">
                            <div class="draft-title">${escapeHtml(draft.title || '无标题')}</div>
                            <div class="draft-meta">创建于 ${draft.created || ''} ${draft.updated && draft.updated !== draft.created ? ' · 更新于 ' + draft.updated : ''}</div>
                            <div class="draft-preview">${escapeHtml(preview)}</div>
                        </div>
                        <div class="draft-actions">
                            <button class="btn-continue" data-id="${draft.id}">继续编辑</button>
                            <button class="btn-publish-draft" data-id="${draft.id}">发布</button>
                            <button class="btn-delete-draft" data-id="${draft.id}">删除</button>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
            list.querySelectorAll('.btn-continue').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    const draft = allDrafts.find(function(d) { return d.id === id; });
                    if (draft) {
                        document.getElementById('editTitle').value = draft.title || '';
                        document.getElementById('editTags').value = (draft.tags || []).join('，');
                        mdEditor.value = draft.content || '';
                        updatePreview();
                        editingIdx = -1;
                        document.querySelector('.tab[data-tab="write"]').click();
                        showToast('已加载草稿');
                    }
                });
            });
            list.querySelectorAll('.btn-publish-draft').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    const draft = allDrafts.find(function(d) { return d.id === id; });
                    if (draft) {
                        document.getElementById('editTitle').value = draft.title || '';
                        document.getElementById('editTags').value = (draft.tags || []).join('，');
                        mdEditor.value = draft.content || '';
                        updatePreview();
                        editingIdx = -1;
                        deleteDraft(id);
                        document.querySelector('.tab[data-tab="write"]').click();
                        document.getElementById('publishBtn').click();
                    }
                });
            });
            list.querySelectorAll('.btn-delete-draft').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    if (confirm('确定要删除这个草稿吗？')) {
                        deleteDraft(id);
                    }
                });
            });
        }

        async function deleteDraft(id) {
            try {
                const res = await apiCall('drafts', {
                    method: 'DELETE',
                    body: JSON.stringify({ id: id })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('草稿已删除');
                    await loadDrafts();
                    renderDraftList();
                    updateBadges();
                } else {
                    showToast(data.error || '删除失败', true);
                }
            } catch (e) {
                showToast('删除失败', true);
            }
        }

        // ===== 发布/更新 =====
        document.getElementById('publishBtn').addEventListener('click', async function() {
            const title = document.getElementById('editTitle').value.trim();
            const content = mdEditor.value.trim();
            const tagsRaw = document.getElementById('editTags').value.trim();
            const tags = tagsRaw ? tagsRaw.split(/[，,、\s]+/).filter(Boolean) : [];
            if (!title) {
                showToast('请输入标题', true);
                return;
            }
            if (!content) {
                showToast('请输入内容', true);
                return;
            }
            this.disabled = true;
            try {
                let res, data;
                if (editingIdx >= 0) {
                    res = await apiCall('posts', {
                        method: 'PUT',
                        body: JSON.stringify({
                            id: editingIdx,
                            title: title,
                            content: content,
                            tags: tags
                        })
                    });
                    data = await res.json();
                    if (data.success) {
                        showToast('文章已更新');
                        editingIdx = -1;
                        clearEditor();
                        await loadArticles();
                        renderArticleList();
                        updateBadges();
                    } else {
                        showToast(data.error || '更新失败', true);
                    }
                } else {
                    res = await apiCall('posts', {
                        method: 'POST',
                        body: JSON.stringify({ title, content, tags })
                    });
                    data = await res.json();
                    if (data.success) {
                        showToast('发布成功！');
                        clearEditor();
                        await loadArticles();
                        renderArticleList();
                        updateBadges();
                    } else {
                        showToast(data.error || '发布失败', true);
                    }
                }
            } catch (e) {
                showToast('请求失败', true);
            }
            this.disabled = false;
        });

        function clearEditor() {
            document.getElementById('editTitle').value = '';
            document.getElementById('editTags').value = '';
            mdEditor.value = '';
            updatePreview();
            editingIdx = -1;
        }

        document.getElementById('cancelEditBtn').addEventListener('click', function() {
            if (editingIdx >= 0 || mdEditor.value || document.getElementById('editTitle').value) {
                if (!confirm('确定要清空当前内容吗？')) return;
            }
            clearEditor();
        });

        document.getElementById('saveDraftBtn').addEventListener('click', async function() {
            const title = document.getElementById('editTitle').value.trim() || '无标题';
            const content = mdEditor.value;
            const tagsRaw = document.getElementById('editTags').value.trim();
            const tags = tagsRaw ? tagsRaw.split(/[，,、\s]+/).filter(Boolean) : [];
            if (!content) {
                showToast('内容为空，无需保存', true);
                return;
            }
            this.disabled = true;
            try {
                const res = await apiCall('drafts', {
                    method: 'POST',
                    body: JSON.stringify({ title, content, tags })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('草稿已保存');
                    await loadDrafts();
                    renderDraftList();
                    updateBadges();
                } else {
                    showToast(data.error || '保存失败', true);
                }
            } catch (e) {
                showToast('保存失败', true);
            }
            this.disabled = false;
        });

        // ===== 筛选 & 搜索 & 排序 =====
        document.querySelectorAll('#tabList .filter-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#tabList .filter-btn').forEach(function(b) { b.classList.remove(
                        'active'); });
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderArticleList();
            });
        });

        // ===== 排序切换 =====
        document.getElementById('sortBtn').addEventListener('click', function() {
            const btn = this;
            if (currentSort === 'desc') {
                currentSort = 'asc';
                btn.innerHTML = '<i class="fas fa-sort-amount-up"></i> 正序';
            } else {
                currentSort = 'desc';
                btn.innerHTML = '<i class="fas fa-sort-amount-down"></i> 倒序';
            }
            renderArticleList();
        });

        document.getElementById('listSearch').addEventListener('input', function() {
            renderArticleList();
        });

        function updateBadges() {
            document.getElementById('listBadge').textContent = allArticles.length;
            document.getElementById('draftBadge').textContent = allDrafts.length;
        }

        // ===== 启动 =====
        if (!checkLogin()) {
            loginScreen.classList.remove('hidden');
            mainApp.classList.remove('active');
        }
    </script>
</body>
</html>
