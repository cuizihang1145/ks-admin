<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>管理后台 · ks</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"><link rel="stylesheet" href="/lib/markdown.css"><link rel="stylesheet" href="./admin.css"></head><body><div class="container"><div id="mainApp"><div class="admin-header"><div class="left-group"><div class="mode-switch-group" id="modeSwitchGroup"><button class="mode-switch-btn active" data-mode="article">文章</button><button class="mode-switch-btn" data-mode="shuoshuo">说说</button><button class="mode-switch-btn" data-mode="friend">友链</button></div></div><div class="right-group"><button class="theme-toggle" id="themeToggle"><i class="fas fa-moon" id="themeIcon"></i></button><button class="btn-logout" id="logoutBtn">退出</button></div></div><div class="tabs" id="tabs"><button class="tab active" data-tab="write">写内容</button><button class="tab" data-tab="list">内容列表 <span class="badge" id="listBadge">0</span></button><button class="tab" data-tab="drafts">草稿箱 <span class="badge" id="draftBadge">0</span></button></div><div class="tab-content active" id="tabWrite"><div class="editor-section"><div class="editor-panel"><div id="articleEditor"><input type="text" id="editTitle" placeholder="文章标题"><div class="editor-row"><div class="date-group"><input type="text" id="editDateText" placeholder="YYYY-MM-DD"><input type="date" id="editDatePicker"></div><input type="text" id="editTags" placeholder="标签，用逗号分隔" style="flex:2"></div><div class="editor-row"><input type="text" id="editAll" list="allSuggest" placeholder="all：0=进入 feed，1=不进入 feed，或自定义" style="flex:1"><datalist id="allSuggest"><option value="0">0 · 进入 feed</option><option value="1">1 · 不进入 feed</option></datalist></div></div><div id="shuoshuoEditor" style="display:none"><input type="text" id="editLocation" placeholder="地点（可选）"><div class="editor-row"><div class="date-group"><input type="text" id="editDateTextShuoshuo" placeholder="YYYY-MM-DD"><input type="date" id="editDatePickerShuoshuo"></div><input type="text" id="editTagsShuoshuo" placeholder="标签，用逗号分隔" style="flex:2"></div></div><div id="friendEditor" style="display:none"><div class="friend-editor-fields"><div><div class="field-label">名称 <span style="color:#e53935;">*</span></div><input type="text" id="friendName" placeholder="例如：示例博客"></div><div><div class="field-label">链接 <span style="color:#e53935;">*</span></div><input type="text" id="friendUrl" placeholder="https://example.com"></div><div><div class="field-label">简介 <span style="color:#e53935;">*</span></div><input type="text" id="friendDesc" placeholder="一句话介绍"></div><div><div class="field-label">Logo（可选）</div><input type="text" id="friendLogo"></div><div><div class="field-label">Feed（可选）</div><input type="text" id="friendFeed"></div><div id="pendingRefArea" style="display:none;" class="pending-ref"><div class="ref-label"><i class="fas fa-clipboard-list"></i> 审核参考</div><div class="ref-row"><span class="ref-key">申请理由</span><span id="pendingReason">-</span></div><div class="ref-row"><span class="ref-key">联系邮箱</span><span id="pendingEmail">-</span></div><div class="ref-row"><span class="ref-key">申请时间</span><span id="pendingTime">-</span></div></div></div></div><div id="markdownEditor"><div class="upkram-toolbar" id="upkramToolbar"><div class="tb-group dropdown-group"><button class="dropdown-trigger" data-dropdown="h" title="标题">H</button><button class="dropdown-trigger" data-dropdown="text" title="基础排版"><i class="fas fa-font"></i></button><button class="dropdown-trigger" data-dropdown="code" title="代码与公式"><i class="fas fa-code"></i></button><button class="dropdown-trigger" data-dropdown="inline" title="行内装饰"><i class="fas fa-wand-magic"></i></button><button class="dropdown-trigger" data-dropdown="block" title="区块与容器"><i class="fas fa-layer-group"></i></button><button class="dropdown-trigger" data-dropdown="forms" title="表单构建器"><i class="fas fa-list-check"></i></button><button class="dropdown-trigger" data-dropdown="callout" title="提示框"><i class="fas fa-circle-info"></i></button></div><span class="tb-spacer"></span><label class="live-preview-toggle" title="关闭后不再自动渲染，可减轻卡顿"><input type="checkbox" id="livePreviewChk" checked><span>实时预览</span></label></div><div class="editor-split" id="editorSplit"><textarea id="mdEditor" placeholder="用 Markdown 写内容..."></textarea><div class="preview markdown-body" id="previewArea"></div></div></div><div class="editor-footer"><span>字数：<span class="word-count" id="wordCount">0</span></span></div><div class="editor-actions" id="editorActions"></div></div></div></div><div class="tab-content" id="tabList"><div id="friendTabContainer" style="display:none;"><div class="friend-tabs" id="friendTabs"><button class="ftab active" data-ftab="existing">已有友链</button><button class="ftab" data-ftab="pending">待审核 <span class="badge" id="pendingBadge">0</span></button></div></div><div class="list-controls"><button class="filter-btn active" data-filter="all">全部</button><button class="filter-btn" data-filter="published">已发布</button><button class="filter-btn" data-filter="deleted">已删除</button><button class="sort-btn" id="sortBtn"><i class="fas fa-sort-amount-down"></i> 倒序</button><input class="search-input" id="listSearch" placeholder="搜索..."><span class="count-badge" id="listCount">0 项</span></div><div class="article-list" id="articleList"></div></div><div class="tab-content" id="tabDrafts"><div class="article-list" id="draftList"></div></div></div></div><div class="modal-overlay" id="modalOverlay"><div class="modal-box"><span class="modal-icon" id="modalIcon"><i class="fas fa-exclamation-triangle"></i></span><div class="modal-title" id="modalTitle">确认操作</div><div class="modal-desc" id="modalDesc">确定要执行此操作吗？</div><div class="modal-actions"><button class="btn-cancel" id="modalCancel">取消</button><button class="btn-confirm" id="modalConfirm">确认</button></div></div></div><div class="toast" id="toast"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script><script>if(window.mermaid){try{mermaid.initialize({startOnLoad:false})}catch(e){}}</script><script src="/lib/markdown.js"></script><script src="./core.js"></script><script src="./editor.js"></script><script src="./editor-forms.js"></script><script src="./content.js"></script><script src="./friends.js"></script><script src="./main.js"></script></body></html>
