<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UpKram · 实时预览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/emoji-js/lib/emoji.min.js"></script>
<link rel="stylesheet" href="upkram-all.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#f5f5fa;color:#1f2330;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;transition:background .25s ease,color .25s ease}
body.dark{background:#1a1a2e;color:#e8e8f5}
.app-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:10px 14px;border-bottom:1px solid #e4e4ee;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);z-index:10}
body.dark .app-bar{background:rgba(30,28,52,.88);border-bottom-color:#2f2d4a}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:.01em}
.brand i{color:#6366f1;font-size:16px}
.brand small{font-weight:400;font-size:11px;color:#9a9ab0;padding:2px 7px;border:1px solid currentColor;border-radius:999px;opacity:.75}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 12px;border-radius:8px;border:1px solid #d9d9e6;background:#fff;color:#3a3a52;font:inherit;font-size:13px;line-height:1.4;cursor:pointer;transition:all .15s;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn:hover{border-color:#6366f1;color:#6366f1;background:#f0f0ff}
.btn:active{transform:translateY(1px)}
.btn-icon{padding:6px 10px;font-size:14px}
.btn-group{display:flex;align-items:center}
.btn-group .btn{border-radius:0;margin-left:-1px}
.btn-group .btn:first-child{border-top-left-radius:8px;border-bottom-left-radius:8px;margin-left:0}
.btn-group .btn:last-child{border-top-right-radius:8px;border-bottom-right-radius:8px}
.btn.engine-all{border-color:#6366f1;color:#6366f1;background:rgba(99,102,241,.08);font-weight:600}
.btn.engine-ni{border-color:#10b981;color:#10b981;background:rgba(16,185,129,.08);font-weight:600}
.btn.mode-btn.active{background:#6366f1;color:#fff;border-color:#6366f1;font-weight:600;z-index:1}
body.dark .btn{background:#2a2845;color:#d6d6ea;border-color:#3d3a5c}
body.dark .btn:hover{border-color:#8b8bff;color:#b9b9ff;background:#322f52}
body.dark .btn.engine-all{border-color:#8b8bff;color:#b9b9ff;background:rgba(139,139,255,.12)}
body.dark .btn.engine-ni{border-color:#2ecc8f;color:#2ecc8f;background:rgba(46,204,143,.12)}
body.dark .btn.mode-btn.active{background:#6366f1;color:#fff;border-color:#6366f1}
.divider-v{width:1px;height:20px;background:#d9d9e6;margin:0 4px}
body.dark .divider-v{background:#3d3a5c}
.workspace{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 6px 1fr;transition:grid-template-columns .15s}
.workspace.editor-only{grid-template-columns:1fr!important}
.workspace.editor-only .divider,.workspace.editor-only .pane:nth-child(3){display:none!important}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.pane-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#9090a8;border-bottom:1px solid #e8e8f0;background:rgba(255,255,255,.45);flex-wrap:wrap}
body.dark .pane-head{color:#8e8eb0;border-bottom-color:#2f2d4a;background:rgba(255,255,255,.02)}
.pane-head .meta{font-weight:400;letter-spacing:0;text-transform:none;font-size:12px;font-variant-numeric:tabular-nums;opacity:.85}
.quick-tools{display:flex;align-items:center;gap:4px;margin-right:auto;margin-left:10px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;max-width:100%}
.quick-tools::-webkit-scrollbar{display:none}
.tool-btn{background:transparent;border:1px solid transparent;color:#6a6a85;cursor:pointer;padding:4px 8px;border-radius:4px;font-size:13px;transition:all .15s;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tool-btn:hover{background:#e4e4ee;color:#1f2330;border-color:#d9d9e6}
body.dark .tool-btn{color:#a0a0c0}
body.dark .tool-btn:hover{background:#3d3a5c;color:#fff;border-color:#3d3a5c}
.tool-btn.txt-h{font-weight:700;font-size:13px;font-family:system-ui,sans-serif}
.custom-dropdown-menu{position:absolute;background:#fff;border:1px solid #d9d9e6;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:8px;z-index:10000;min-width:260px;max-height:70vh;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px}
body.dark .custom-dropdown-menu{background:#2a2845;border-color:#3d3a5c;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.custom-dropdown-item{padding:6px 8px;font-size:12.5px;color:#3a3a52;border-radius:4px;cursor:pointer;white-space:nowrap;text-align:left;transition:background .15s;overflow:hidden;text-overflow:ellipsis}
.custom-dropdown-item:hover{background:#f0f0ff;color:#6366f1}
body.dark .custom-dropdown-item{color:#d6d6ea}
body.dark .custom-dropdown-item:hover{background:#3d3a5c;color:#b9b9ff}
.dropdown-header{grid-column:1/-1;padding:4px 8px;font-size:11px;font-weight:bold;color:#9090a8;text-transform:uppercase;border-bottom:1px solid #e4e4ee;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
body.dark .dropdown-header{border-bottom-color:#3d3a5c}
.form-modal-mask{position:fixed;inset:0;z-index:99999;background:rgba(20,18,40,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.form-dialog{width:100%;max-width:680px;max-height:90vh;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;animation:formIn .2s cubic-bezier(.34,1.56,.64,1)}
@keyframes formIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
body.dark .form-dialog{background:#232140;color:#e8e8f5}
.form-dialog-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #e4e4ee;flex-shrink:0;gap:10px}
.form-dialog-head h3{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form-dialog-head h3 i{color:#6366f1;font-size:15px;flex-shrink:0}
body.dark .form-dialog-head{border-bottom-color:#2f2d4a}
.form-dialog-close{width:30px;height:30px;border:none;background:transparent;font-size:20px;cursor:pointer;color:#6a6a85;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.form-dialog-close:hover{background:rgba(0,0,0,.06);color:#1f2330}
body.dark .form-dialog-close{color:#a0a0c0}
body.dark .form-dialog-close:hover{background:rgba(255,255,255,.08);color:#fff}
.form-dialog-body{padding:16px 18px;overflow-y:auto;flex:1 1 auto}
.form-dialog-foot{padding:12px 18px;border-top:1px solid #e4e4ee;display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;flex-wrap:wrap}
body.dark .form-dialog-foot{border-top-color:#2f2d4a}
.form-group{margin-bottom:14px}
.form-group:last-child{margin-bottom:0}
.form-group>label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:#3a3a52;min-height:17px;line-height:17px}
body.dark .form-group>label{color:#d6d6ea}
.form-hint{font-size:11.5px;color:#9a9ab0;margin-top:4px;line-height:1.4}
.form-input,.form-textarea,.form-select{width:100%;padding:7px 10px;border-radius:6px;border:1px solid #d9d9e6;background:#fff;color:inherit;font:inherit;font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.form-textarea{min-height:60px;resize:vertical;font-family:inherit;line-height:1.5}
body.dark .form-input,body.dark .form-textarea,body.dark .form-select{background:#1a1830;border-color:#3d3a5c}
body.dark .form-input:focus,body.dark .form-textarea:focus,body.dark .form-select:focus{border-color:#8b8bff;box-shadow:0 0 0 3px rgba(139,139,255,.15)}
.form-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;flex-wrap:wrap}
.form-row>*{flex-shrink:0}
.form-row>.form-input,.form-row>.form-textarea,.form-row>.form-select{flex:1 1 120px;min-width:0}
.form-row>.form-group{flex:1 1 120px;min-width:0;margin-bottom:0}
.form-row .w-small{flex:0 0 72px!important}
.form-row .w-mid{flex:0 0 120px!important}
.btn.small{padding:4px 10px;font-size:12px;border-radius:6px}
.btn.danger{color:#e74c6f;border-color:#f8c8d2}
.btn.danger:hover{background:#fef2f5;border-color:#e74c6f;color:#e74c6f}
.msg-editor,.item-editor{padding:12px;border-radius:8px;background:#fafaff;border:1px solid #e4e4ee;margin-bottom:10px;position:relative}
body.dark .msg-editor,body.dark .item-editor{background:#1a1830;border-color:#3d3a5c}
.user-row{padding:8px 10px;border-radius:8px;background:#fafaff;border:1px solid #e4e4ee;margin-bottom:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
body.dark .user-row{background:#1a1830;border-color:#3d3a5c}
.user-row .user-name{flex:0 0 90px!important}
.user-row .user-color{flex:0 0 110px!important}
.user-row .user-avatar{flex:1 1 160px!important;min-width:100px}
.side-btn[data-side="right"]{background:#6366f1;color:#fff;border-color:#6366f1}
.side-btn[data-side="right"]:hover{background:#4d4fc0;color:#fff}
.tbl-preview-edit{border:1px solid #e4e4ee;border-radius:8px;overflow:auto;max-height:420px;background:#fff}
body.dark .tbl-preview-edit{background:#1a1830;border-color:#3d3a5c}
.tbl-preview-caption{padding:8px 12px;background:#f5f5fa;border-bottom:1px solid #e4e4ee;font-size:12.5px;font-weight:600;color:#3a3a52;display:flex;align-items:center;gap:6px}
body.dark .tbl-preview-caption{background:#2a2845;border-bottom-color:#3d3a5c;color:#d6d6ea}
.tbl-preview-caption-empty{color:#a0a0c0;font-style:italic;font-weight:400}
.tbl-preview-edit table{width:100%;border-collapse:collapse;font-size:12px}
.tbl-preview-edit th,.tbl-preview-edit td{border-bottom:1px solid #e4e4ee;border-right:1px solid #e4e4ee;padding:0}
.tbl-preview-edit th:last-child,.tbl-preview-edit td:last-child{border-right:none}
.tbl-preview-edit tr:last-child td{border-bottom:none}
.tbl-preview-edit th{background:#f5f5fa}
body.dark .tbl-preview-edit th{background:#2a2845}
body.dark .tbl-preview-edit th,body.dark .tbl-preview-edit td{border-color:#3d3a5c}
.tbl-preview-edit .tbl-edit-head,.tbl-preview-edit .tbl-edit-cell{width:100%;box-sizing:border-box;border:none;background:transparent;color:inherit;font:inherit;font-size:12px;padding:6px 8px;outline:none;min-width:80px}
.tbl-preview-edit .tbl-edit-head{font-weight:600}
.tbl-preview-edit .tbl-edit-head:focus,.tbl-preview-edit .tbl-edit-cell:focus{background:rgba(99,102,241,.08);box-shadow:inset 0 0 0 2px #6366f1}
.tbl-preview-edit .tbl-align-row th{padding:0;background:#f0f0f8}
body.dark .tbl-preview-edit .tbl-align-row th{background:#1a1830}
.tbl-preview-edit .tbl-edit-align{width:100%;border:none;background:transparent;color:inherit;font:inherit;font-size:11px;padding:3px 4px;outline:none;cursor:pointer;text-align:center}
#editor{flex:1 1 auto;width:100%;min-height:0;padding:18px 20px 60px;border:0;outline:0;resize:none;background:transparent;color:inherit;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;line-height:1.75;tab-size:2}
#editor::placeholder{color:#a9a9bd}
.preview-scroll{flex:1 1 auto;min-height:0;overflow:auto;padding:22px 28px 90px;overscroll-behavior:contain;position:relative}
#content{max-width:800px;margin:0 auto}
.divider{position:relative;cursor:col-resize;background:transparent;touch-action:none}
.divider::after{content:'';position:absolute;inset:0 2px;border-radius:3px;background:#e3e3ee;transition:background .15s}
.divider:hover::after,.divider.dragging::after{background:#6366f1}
body.dark .divider::after{background:#2c2a47}
body.dark .divider:hover::after,body.dark .divider.dragging::after{background:#7c7cff}
.drop-mask{position:fixed;inset:0;z-index:10000;background:rgba(99,102,241,.2);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;border:4px dashed #6366f1;pointer-events:none}
.drop-mask.on{display:flex}
.drop-mask span{background:#6366f1;color:#fff;padding:12px 24px;border-radius:8px;font-size:20px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{border-radius:8px;border:3px solid transparent;background-clip:content-box;background-color:#cccddd}
::-webkit-scrollbar-thumb:hover{background-color:#adaec6}
body.dark ::-webkit-scrollbar-thumb{background-color:#3a3860}
body.dark ::-webkit-scrollbar-thumb:hover{background-color:#4c4980}
.modal-mask{position:fixed;inset:0;background:rgba(20,18,40,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
.modal-mask.on{display:flex}
.modal{width:100%;max-width:900px;max-height:90vh;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;font-family:'Inter',system-ui,sans-serif}
body.dark .modal{background:#232140;color:#e8e8f5}
.modal-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid #e4e4ee}
body.dark .modal-head{border-bottom-color:#2f2d4a}
.modal-head h3{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.modal-head h3 i{color:#6366f1}
.modal-close{width:32px;height:32px;border:none;border-radius:8px;background:transparent;color:#6a6a85;cursor:pointer;font-size:18px;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,color .15s;-webkit-tap-highlight-color:transparent}
.modal-close:hover{background:rgba(0,0,0,.06);color:#1f2330}
body.dark .modal-close{color:#a0a0c0}
body.dark .modal-close:hover{background:rgba(255,255,255,.08);color:#fff}
.modal-body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:14px 18px;gap:10px}
.modal-tip{font-size:12.5px;color:#6a6a85;line-height:1.55;margin:0}
body.dark .modal-tip{color:#9a9ac0}
.modal-tip code{background:rgba(99,102,241,.12);color:#4d4fc0;padding:1px 5px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11.5px}
body.dark .modal-tip code{background:rgba(139,139,255,.18);color:#b9b9ff}
#export-text{flex:1 1 auto;min-height:260px;width:100%;resize:none;padding:12px 14px;border:1px solid #d9d9e6;border-radius:10px;background:#fafaff;color:#1f2330;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;line-height:1.55;white-space:pre;overflow:auto;outline:none;tab-size:2}
#export-text:focus{border-color:#6366f1}
body.dark #export-text{background:#1a1830;border-color:#3d3a5c;color:#d6d6ea}
.modal-foot{flex:0 0 auto;display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid #e4e4ee;flex-wrap:wrap}
body.dark .modal-foot{border-top-color:#2f2d4a}
.btn-primary{background:#6366f1;color:#fff;border-color:#6366f1}
.btn-primary:hover{background:#4d4fc0;border-color:#4d4fc0;color:#fff}
body.dark .btn-primary{background:#6d6dff;border-color:#6d6dff}
body.dark .btn-primary:hover{background:#8b8bff;border-color:#8b8bff;color:#fff}
.immersive-mask{position:fixed;inset:0;z-index:9998;background:#f5f5fa;color:#1f2330;display:none;flex-direction:column;transition:background .25s ease,color .25s ease}
body.dark .immersive-mask{background:#1a1a2e;color:#e8e8f5}
.immersive-mask.on{display:flex}
.immersive-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid #e4e4ee;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body.dark .immersive-bar{background:rgba(30,28,52,.88);border-bottom-color:#2f2d4a}
.immersive-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;border:1px solid #d9d9e6;background:#fff;color:#3a3a52;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;transition:border-color .15s,color .15s;-webkit-tap-highlight-color:transparent}
.immersive-btn.btn-icon{padding:6px 10px}
.immersive-btn:hover{border-color:#6366f1;color:#6366f1}
body.dark .immersive-btn{background:#2a2845;color:#d6d6ea;border-color:#3d3a5c}
body.dark .immersive-btn:hover{border-color:#8b8bff;color:#b9b9ff}
.immersive-brand{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:.01em}
.immersive-brand i{color:#6366f1;font-size:16px}
.immersive-bar-actions{display:flex;align-items:center;gap:6px}
.immersive-body{flex:1 1 auto;min-height:0;overflow:auto;padding:22px 20px 90px;overscroll-behavior:contain}
.immersive-container{max-width:800px;margin:0 auto}
@media(max-width:860px){.workspace{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.workspace.editor-only{grid-template-rows:1fr!important}.divider{display:none}.preview-scroll{padding:16px 18px 60px}#editor{padding:14px 16px 40px}.hide-text-mobile span.label{display:none}.hide-text-mobile{padding:6px 10px;font-size:14px}}
@media(max-width:620px){.btn{padding:6px 8px;font-size:12px}.btn-icon{padding:6px 8px;font-size:13px}.app-bar{gap:8px;justify-content:flex-start}.custom-dropdown-menu{grid-template-columns:1fr;min-width:180px}.form-dialog{max-height:95vh}}
</style>
</head>
<body>
<datalist id="color-suggest">
<option value="red">红色 #e74c6f</option>
<option value="green">绿色 #10b981</option>
<option value="orange">橙色 #d97706</option>
<option value="yellow">黄色 #f59e0b</option>
<option value="blue">蓝色 #4a90d9</option>
<option value="purple">紫色 #6b5acf</option>
<option value="pink">粉色 #ec4899</option>
<option value="cyan">青色 #06b6d4</option>
<option value="gray">灰色 #8a8ab5</option>
<option value="#6b5acf">#6b5acf</option>
<option value="#e74c6f">#e74c6f</option>
<option value="#10b981">#10b981</option>
<option value="#4a90d9">#4a90d9</option>
<option value="#f59e0b">#f59e0b</option>
</datalist>
<div class="drop-mask" id="drop-mask"><span>松手导入 Markdown 文件</span></div>
<header class="app-bar">
<div class="brand"><i class="fa-solid fa-feather-pointed"></i> UpKram <small>实时预览</small></div>
<div class="actions">
<button class="btn engine-all" id="btn-engine" title="切换解析引擎"><i class="fa-solid fa-microchip"></i> 引擎: <span id="engine-label">All</span></button>
<div class="divider-v"></div>
<div class="btn-group">
<button class="btn btn-icon" id="btn-import" title="导入本地 .md 文件"><i class="fa-solid fa-folder-open"></i></button>
<button class="btn btn-icon" id="btn-sample" title="载入示例"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
<button class="btn btn-icon" id="btn-clear" title="清空输入"><i class="fa-solid fa-eraser"></i></button>
</div>

function openFormDialog(title,icon,bodyHtml,onGenerate){
var existing=document.querySelector('.form-modal-mask');
if(existing)existing.remove();
var mask=document.createElement('div');
mask.className='form-modal-mask';
mask.innerHTML='<div class="form-dialog"><div class="form-dialog-head"><h3><i class="'+(icon||'fa-solid fa-pen-to-square')+'"></i>'+title+'</h3><button class="form-dialog-close" type="button">×</button></div><div class="form-dialog-body">'+bodyHtml+'</div><div class="form-dialog-foot"><button type="button" class="btn btn-primary form-insert"><i class="fa-solid fa-arrow-down"></i> 插入</button><button type="button" class="btn form-cancel">取消</button></div></div>';
document.body.appendChild(mask);
function close(){if(mask.parentNode)mask.remove();}
mask.querySelector('.form-dialog-close').onclick=close;
mask.querySelector('.form-cancel').onclick=close;
mask.addEventListener('click',function(e){if(e.target===mask)close();});
document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc);}});
mask.querySelector('.form-insert').onclick=function(){
try{
var md=onGenerate(mask);
if(!md)return;
var start=editor.selectionStart,end=editor.selectionEnd;
editor.setRangeText(md,start,end,'end');
editor.selectionStart=editor.selectionEnd=start+md.length;
editor.focus();scheduleRender(true);close();showToast('已插入 '+title);
}catch(err){alert('生成失败：'+(err&&err.message?err.message:err));}
};
setTimeout(function(){var firstInput=mask.querySelector('input, textarea, select');if(firstInput)firstInput.focus();},80);
}

function openChatForm(){

var c=row.querySelector('.user-color').value.trim();
var a=row.querySelector('.user-avatar').value.trim();

var parts=[n+':'];

if(a)parts.push('avatar='+a);

});
if(userLines.length){lines.push(':::users');lines.push.apply(lines,userLines);lines.push(':::');}

var msgEditors=mask.querySelectorAll('.msg-editor');
if(!msgEditors.length)throw new Error('至少需要一条消息');
msgEditors.forEach(function(me){
var name=me.querySelector('.msg-name').value.trim()||'某人';
var time=me.querySelector('.msg-time').value.trim()||'09:30';
var side=me.querySelector('.side-btn').dataset.side||'left';

var type=me.querySelector('.msg-type').value;
var header=':::msg '+name+' '+side+' '+time;
if(status)header+=' "'+status.replace(/"/g,'\\"')+'"';
if(type==='text'){
var c=me.querySelector('.msg-content').value.trim()||' ';
lines.push(header);lines.push(c);lines.push(':::');
}else if(type==='redpacket'){
var b=me.querySelector('.rp-blessing').value.trim()||'恭喜发财，大吉大利';
var am=me.querySelector('.rp-amount').value.trim()||'100';
var wStr='';

if(wText){var ws=wText.split('\n').map(function(l){return l.trim().replace(/[：:]\s*/g,':');}).filter(Boolean);if(ws.length)wStr=' winners="'+ws.join('|')+'"';}
lines.push(header);lines.push(':::redpacket blessing='+b+' amount='+am+wStr);lines.push(':::');lines.push(':::');
}else if(type==='transfer'){
var ta=me.querySelector('.tf-amount').value.trim()||'200';
var tn=me.querySelector('.tf-note').value.trim();
lines.push(header);lines.push(':::transfer amount='+ta+(tn?' note='+tn:''));lines.push(':::');lines.push(':::');
}else if(type==='card'){
var cn=me.querySelector('.card-name').value.trim()||'某人';
var cd=me.querySelector('.card-desc').value.trim();
lines.push(header);lines.push(':::card name='+cn+(cd?' desc='+cd:''));lines.push(':::');lines.push(':::');
}else if(type==='image'){
var iu=me.querySelector('.img-url').value.trim();
var ia=me.querySelector('.img-alt').value.trim();
if(!iu)throw new Error('图片 URL 不能为空');
lines.push(header);lines.push(':::img url='+iu+(ia?' alt='+ia:''));lines.push(':::');lines.push(':::');
}else if(type==='quote'){
var qn=me.querySelector('.quote-name').value.trim()||name;
var qid=me.querySelector('.quote-id').value.trim();
var c=me.querySelector('.msg-content').value.trim()||' ';
lines.push(header);lines.push(':::quote '+qn+(qid?' id='+qid:''));lines.push(':::');lines.push(c);lines.push(':::');
}
});
lines.push(':::');
return lines.join('\n');
});

function openTableForm(){
var body=
'<div class="form-row">'+
'<div class="form-group" style="flex:1"><label>数据行数（不含表头）</label><input id="tbl-rows" class="form-input" type="number" min="1" max="50" value="3"></div>'+
'<div class="form-group" style="flex:1"><label>列数</label><input id="tbl-cols" class="form-input" type="number" min="1" max="20" value="3"></div>'+
'</div>'+
'<div class="form-group"><label>表格标题（可选，加 {sort} 启用排序）</label><input id="tbl-caption" class="form-input" placeholder="如：成绩单 {sort}"></div>'+
'<div class="form-group"><label>直接编辑下方每个单元格（表头 + 每列对齐 + 数据）</label><div id="tbl-preview" class="tbl-preview-edit"></div></div>';
openFormDialog('表格生成器','fa-solid fa-table',body,function(mask){
var caption=mask.querySelector('#tbl-caption').value.trim();
var headers=[],aligns=[],data=[];
mask.querySelectorAll('#tbl-preview .tbl-edit-head').forEach(function(inp){headers.push(inp.value);});
mask.querySelectorAll('#tbl-preview .tbl-edit-align').forEach(function(sel){aligns.push(sel.value);});
mask.querySelectorAll('#tbl-preview .tbl-edit-row').forEach(function(row){
var cells=[];
row.querySelectorAll('.tbl-edit-cell').forEach(function(inp){cells.push(inp.value);});
data.push(cells);
});
if(!headers.length)throw new Error('至少需要一列');
function escCell(s){
s=String(s==null?'':s);
return s.replace(/\\/g,'\\\\').replace(/\|/g,'\\|');
}
function sepFor(a){
if(a==='left')return':---';
if(a==='center')return':---:';
if(a==='right')return'---:';
return'---';
}
var lines=[];
if(caption)lines.push('Table: '+caption);
lines.push('| '+headers.map(function(h){return escCell(h)||' ';}).join(' | ')+' |');
lines.push('| '+aligns.map(sepFor).join(' | ')+' |');
data.forEach(function(row){
lines.push('| '+row.map(function(c){return escCell(c)||' ';}).join(' | ')+' |');
});
return '\n'+lines.join('\n')+'\n';
});
var mask=document.querySelector('.form-modal-mask');
var rowsInput=mask.querySelector('#tbl-rows');
var colsInput=mask.querySelector('#tbl-cols');
var captionInput=mask.querySelector('#tbl-caption');
var previewEl=mask.querySelector('#tbl-preview');
function collect(){
var headers=[],aligns=[],data=[];
previewEl.querySelectorAll('.tbl-edit-head').forEach(function(inp){headers.push(inp.value);});
previewEl.querySelectorAll('.tbl-edit-align').forEach(function(sel){aligns.push(sel.value);});
previewEl.querySelectorAll('.tbl-edit-row').forEach(function(row){
var cells=[];
row.querySelectorAll('.tbl-edit-cell').forEach(function(inp){cells.push(inp.value);});
data.push(cells);
});
return {headers:headers,aligns:aligns,data:data};
}
function renderCaption(){
var caption=captionInput.value.trim();
var capEl=previewEl.querySelector('.tbl-preview-caption');
if(!capEl)return;
if(caption){
capEl.className='tbl-preview-caption';
capEl.innerHTML='<i class="fa-solid fa-table"></i> '+escHtml(caption)+(/\{sort\}/i.test(caption)?' <span style="font-size:11px;opacity:.7;margin-left:4px">（开启排序）</span>':'');
}else{
capEl.className='tbl-preview-caption tbl-preview-caption-empty';
capEl.textContent='（无表格标题）';
}
}
function renderTable(){
var rows=Math.max(1,parseInt(rowsInput.value)||1);
var cols=Math.max(1,parseInt(colsInput.value)||1);
var state=collect();

html+='</tr></thead>';

}

if(savedTheme)applyTheme(savedTheme==='dark');
else applyTheme(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
var savedSrc=null;
try{savedSrc=localStorage.getItem(STORE_SRC);}catch(e){}
if(savedSrc===null){try{savedSrc=localStorage.getItem(STORE_SRC_LEGACY);}catch(e){}}
editor.value=(savedSrc!==null&&savedSrc!=='')?savedSrc:'';
scheduleRender(true);
})();
})();
